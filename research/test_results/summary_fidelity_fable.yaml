# Fidelity review: original article vs cheap-model summaries, judged by Fable 5
# (in-session, reading the full original text, the gold tags, and both summaries).
#
# Per summary:
#   gold_evidence: for each gold tag, is the evidence supporting it present in
#     the summary? present / partial / absent
#   missing: material information absent from the summary (figures, mechanism-
#     bearing claims), with severity: high = would likely change a tag or score,
#     medium = weakens confidence/attribution, low = colour
#   errors: statements in the summary the original does not support
#
# method note: severities are judged against the classifier's task (v6 prompt),
# not general reading interest.

reviewer: claude-fable-5 (in-session)
date: 2026-09-02
summariser_prompt: summarisation/v1

articles:
  "01":
    title: Investigating three real-world incidents in our cybersecurity evaluations
    gold_tags: [prac:evaluation, prac:integration]
    haiku:
      gold_evidence:
        prac:evaluation: present   # transcript monitoring, vendor assurance retained
        prac:integration: partial  # "evaluation infrastructure hardening" retained, vendor-infrastructure framing thinned
      missing:
        - {item: "package live for roughly one hour", severity: low}
        - {item: "earliest incidents date to April", severity: low}
        - {item: "planned release of redacted transcript", severity: low}
        - {item: "GA safeguards would have blocked the behaviours; harness vs alignment failure framing", severity: medium}
      errors:
        - "'obtaining a phone number through extended effort' — the model tried and FAILED to obtain a phone number, then backtracked to a free email provider"
    gpt:
      gold_evidence:
        prac:evaluation: present
        prac:integration: partial  # vendor collaboration retained, "same monitoring and hardening" claim thinned
      missing:
        - {item: "three models responded differently once targets looked real (the behavioural comparison)", severity: medium}
        - {item: "defense-in-depth lessons / GA safeguards would have blocked", severity: medium}
      errors: []
    note: >
      Both summaries keep the incident mechanics but compress the *policy
      response* framing; the classifier read both as "other" rather than
      safety_policy, which the raw run got right.

