# ---------------------------------------------------------------------------
# Aggregate: survival of the evidence behind each of the 68 gold tags
# (present / partial / absent, counted from the per-article assessments above)
#
#             present   partial   absent   retention (partial = 0.5)
#   haiku       52        11        5          85%  (57.5/68)
#   gpt-5-mini  54        10        4          87%  (59/68)
#
# Unsupported-content incidents (errors lists above):
#   haiku       8 incidents across 6 articles, including two cases of tagging-
#               vocabulary leakage into the summary (23, 24), two cases of
#               navigation links reported as article content (22, 23), one
#               factual distortion (01: "obtained a phone number" — it failed
#               to), one attribution slip (12), and editorial inflation of a
#               161-char abstract (27).
#   gpt-5-mini  1 incident (30: "model release" framing slip). No fabricated
#               facts, no vocabulary leakage, no furniture scraped as content.
#
# Reading of the pattern:
#   - Headline figures survive summarisation almost perfectly in both models.
#   - What dies is the low-salience, mechanism-bearing sentence: "high-volume
#     work economical at much greater scale", "more token-efficient than past
#     models", "smarter context management", "works smoothly across agent
#     frameworks", "we expect demand to be very high", methodology footnotes.
#     Both summarisers dropped several of the SAME sentences independently —
#     the loss is systematic (these read as filler to a summariser), not noise.
#   - Framing loss is real: an opinion piece compressed to its embedded
#     benchmarks reads as a release (26); an incident writeup compressed to its
#     mechanics loses its policy-response character (01).
#   - Haiku editorialises and occasionally injects the tag vocabulary itself;
#     GPT-5-mini at low reasoning effort is strictly extractive and quote-heavy.
