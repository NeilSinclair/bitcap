<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIT Capital — Research Overview</title>
<style>
  :root{
    --bg:#0d1117; --panel:#151b23; --panel2:#1c232d; --line:#2a323d;
    --tx:#e6edf3; --dim:#9aa7b4; --faint:#6e7c8c;
    --accent:#4c9aff; --pos:#3fb950; --neg:#f85149; --warn:#d29922;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1180px;margin:0 auto;padding:0 22px 80px}

  header{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#121822,#0d1117);
    padding:34px 0 0;margin-bottom:26px}
  h1{margin:0 0 6px;font-size:27px;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:14px;margin-bottom:22px}
  .sub b{color:var(--tx);font-weight:600}

  nav{display:flex;gap:2px;flex-wrap:wrap}
  nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);
    font:inherit;font-size:14px;padding:9px 14px;cursor:pointer;border-radius:6px 6px 0 0}
  nav button:hover{color:var(--tx);background:var(--panel)}
  nav button.on{color:var(--tx);border-bottom-color:var(--accent);font-weight:600}

  section{display:none} section.on{display:block}
  h2{font-size:19px;margin:30px 0 4px;letter-spacing:-.01em}
  h2:first-child{margin-top:6px}
  .note{color:var(--dim);font-size:13.5px;margin:0 0 16px;max-width:78ch}

  .grid{display:grid;gap:14px}
  .g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  .stat .k{color:var(--faint);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em}
  .stat .v{font-size:25px;font-weight:650;letter-spacing:-.02em;margin-top:5px}
  .stat .d{color:var(--dim);font-size:12.5px;margin-top:3px}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--faint);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;
    font-weight:600;cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:0;
    background:var(--panel)}
  th:hover{color:var(--tx)}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
  tbody tr:hover{background:var(--panel2)}
  .scroll{max-height:620px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  .pos{color:var(--pos)} .neg{color:var(--neg)} .dim{color:var(--dim)} .faint{color:var(--faint)}
  .tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:600;
    background:#1f2b3d;color:var(--accent);border:1px solid #2c3d55}
  .tag.new{background:#122b1b;color:var(--pos);border-color:#1d4429}
  .tag.out{background:#2d1618;color:var(--neg);border-color:#4a2226}

  input[type=search]{background:var(--panel2);border:1px solid var(--line);color:var(--tx);
    border-radius:8px;padding:8px 12px;font:inherit;font-size:13.5px;width:260px;margin-bottom:12px}
  input[type=search]:focus{outline:0;border-color:var(--accent)}

  .bar{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden;min-width:70px}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:4px}

  .fund{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
  .fund>summary{padding:14px 18px;cursor:pointer;list-style:none;display:flex;
    align-items:center;gap:14px;flex-wrap:wrap}
  .fund>summary::-webkit-details-marker{display:none}
  .fund>summary:hover{background:var(--panel2)}
  .fund .nm{font-weight:600;flex:1;min-width:210px}
  .fund .aum{font-family:var(--mono);font-size:13px;color:var(--dim)}
  .fund .body{padding:4px 18px 20px;border-top:1px solid var(--line)}
  .chev{color:var(--faint);font-size:12px}
  details[open] .chev{transform:rotate(90deg)}
  .chev{display:inline-block;transition:transform .15s}

  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:13px;margin:10px 0}
  .kv dt{color:var(--faint)} .kv dd{margin:0;font-family:var(--mono);font-size:12.5px}
  blockquote{margin:12px 0;padding:10px 16px;border-left:3px solid var(--accent);
    background:var(--panel2);border-radius:0 8px 8px 0;color:var(--dim);font-size:13.5px}
  blockquote p{margin:0 0 6px} blockquote cite{color:var(--faint);font-size:12px;font-style:normal}
  .commentary{font-size:13.5px;color:var(--dim);white-space:pre-wrap;line-height:1.6}

  .caveat{border-left:3px solid var(--warn);background:#241f10;padding:12px 16px;
    border-radius:0 8px 8px 0;font-size:13.5px;margin:14px 0}
  .caveat b{color:var(--warn)}
  ul.tight{margin:8px 0;padding-left:20px;font-size:13.5px;color:var(--dim)}
  ul.tight li{margin:5px 0}
  ol.steps{padding-left:20px;font-size:13.5px;color:var(--dim)}
  ol.steps li{margin:8px 0} ol.steps b{color:var(--tx)}
  svg{display:block;width:100%;height:auto;overflow:visible}
  tr.exp{cursor:pointer} tr.exp:hover{background:var(--panel2)}
  tr.exp td:first-child::before{content:"\25B8";color:var(--faint);
    display:inline-block;width:14px;transition:transform .15s}
  tr.exp.open td:first-child::before{transform:rotate(90deg)}
  tr.detail>td{background:var(--panel2);padding:14px 18px 18px;border-bottom:1px solid var(--line)}
  .ctrls{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:12px}
  .ctrls button{background:var(--panel);border:1px solid var(--line);color:var(--dim);
    border-radius:6px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
  .ctrls button.on{border-color:var(--accent);color:var(--accent);background:#16202e}
  .ctrls .spacer{flex:1}
  .legend{font-size:12px;color:var(--faint);margin-top:6px}
  .src{font-size:12px;color:var(--faint);margin-top:8px}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>BIT Capital — Research Overview</h1>
  <div class="sub" id="hdr"></div>
  <nav id="nav"></nav>
</div></header>

<div class="wrap">
  <section id="s-overview" class="on"></section>
  <section id="s-funds"></section>
  <section id="s-positions"></section>
  <section id="s-history"></section>
  <section id="s-sources"></section>
</div>

<script>
const DATA = /*__DATA__*/null;
const {funds, gtl, analysis, firm, compare, views, history} = DATA;
const V = views;

const usd = v => v >= 1e9 ? '$' + (v/1e9).toFixed(2) + 'bn' : '$' + Math.round(v/1e6).toLocaleString() + 'm';
const pct = v => (v == null ? '—' : v.toFixed(2) + '%');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const title = s => String(s).toLowerCase().replace(/\b[a-z]/g, m => m.toUpperCase());
const el = (id, html) => document.getElementById(id).innerHTML = html;

/* ---------- header + nav ---------- */
el('hdr', `<b>${firm.aum}</b> AUM · founded ${firm.founded} · ${firm.hq.split(',').slice(-2).join(',').trim()}
  · <b>${views.total_positions}</b> disclosed positions across 6 funds · statements ${views.date_range[0]} to ${views.date_range[1]}`);

const TABS = [['overview','Overview'],['funds','Funds'],['positions','Positions'],
              ['history','History & turnover'],['sources','Sources & caveats']];
el('nav', TABS.map(([k,l],i) =>
  `<button data-t="${k}" class="${i===0?'on':''}">${l}</button>`).join(''));
document.getElementById('nav').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === 's-' + b.dataset.t));
  window.scrollTo(0, 0);
};

/* ---------- sortable tables ---------- */
function sortable(tbl) {
  tbl.querySelectorAll('th').forEach((th, i) => th.onclick = () => {
    const tb = tbl.tBodies[0], rows = [...tb.rows];
    const dir = th.dataset.dir === 'asc' ? -1 : 1;
    tbl.querySelectorAll('th').forEach(o => delete o.dataset.dir);
    th.dataset.dir = dir === 1 ? 'asc' : 'desc';
    const val = r => {
      const t = r.cells[i].dataset.v ?? r.cells[i].textContent;
      const n = parseFloat(String(t).replace(/[^0-9.\-]/g, ''));
      return isNaN(n) ? String(t).toLowerCase() : n;
    };
    rows.sort((a, b) => { const x = val(a), y = val(b);
      return (typeof x === 'number' && typeof y === 'number') ? (x - y) * dir
           : String(x).localeCompare(String(y)) * dir; });
    rows.forEach(r => tb.appendChild(r));
  });
}

/* ---------- charts ---------- */
function lineChart(series, key, fmt, colour) {
  const W = 720, H = 190, P = 42;
  const vals = series.map(d => d[key]);
  const max = Math.max(...vals) * 1.08, min = 0;
  const x = i => P + i * (W - P - 12) / (series.length - 1);
  const y = v => H - 26 - (v - min) / (max - min) * (H - 50);
  const pts = series.map((d, i) => `${x(i)},${y(d[key])}`).join(' ');
  const ticks = [0, max / 2, max].map(v =>
    `<text x="${P - 8}" y="${y(v) + 4}" text-anchor="end" fill="#6e7c8c" font-size="10">${fmt(v)}</text>
     <line x1="${P}" y1="${y(v)}" x2="${W - 12}" y2="${y(v)}" stroke="#2a323d" stroke-width="1"/>`).join('');
  const lbls = series.map((d, i) => (i % 4 === 0 || i === series.length - 1)
    ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" fill="#6e7c8c" font-size="10">${d.period.slice(2, 7)}</text>` : '').join('');
  const dots = series.map((d, i) =>
    `<circle cx="${x(i)}" cy="${y(d[key])}" r="2.6" fill="${colour}"><title>${d.period} · ${fmt(d[key])}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}">${ticks}
    <polyline points="${pts}" fill="none" stroke="${colour}" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>${dots}${lbls}</svg>`;
}

function barChart(rows, labelKey, valKey, fmt) {
  const max = Math.max(...rows.map(r => r[valKey]));
  return rows.map(r => `<tr>
    <td>${esc(title(r[labelKey]))}</td>
    <td style="width:45%"><div class="bar"><i style="width:${(r[valKey] / max * 100).toFixed(1)}%"></i></div></td>
    <td class="n">${fmt(r[valKey])}</td></tr>`).join('');
}

/* ---------- position history: holding bars + optional price line ---------- */
const METRICS = {
  shares: {label: 'Shares held', fmt: v => v >= 1e6 ? (v/1e6).toFixed(1)+'m'
                                          : v >= 1e3 ? Math.round(v/1e3)+'k' : String(v)},
  value_usd: {label: 'Position value', fmt: v => v >= 1e6 ? '$'+Math.round(v/1e6)+'m'
                                                 : '$'+Math.round(v/1e3)+'k'},
  pct: {label: '% of 13F book', fmt: v => v.toFixed(2)+'%'},
};

const ms = d => Date.parse(d);

function positionChart(rec, metric, showPrice) {
  const W = 860, H = 250, L = 62, R = 60, T = 14, B = 30;
  const qs = rec.quarters, m = METRICS[metric];
  const price = showPrice ? (rec.price || []) : [];

  // One time axis shared by both series: quarter-end bars and a denser price
  // line only line up if they are positioned by date, not by index.
  const t0 = ms(qs[0].period);
  const t1 = Math.max(ms(qs[qs.length-1].period), ...(price.length ? [ms(price[price.length-1].date)] : []));
  const x = t => L + (t - t0) / (t1 - t0) * (W - L - R);

  const hMax = Math.max(...qs.map(q => q[metric])) * 1.12 || 1;
  const yH = v => H - B - v / hMax * (H - B - T);
  const bw = Math.max(4, (W - L - R) / qs.length * 0.62);

  const grid = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const v = hMax * f;
    return `<line x1="${L}" y1="${yH(v)}" x2="${W-R}" y2="${yH(v)}" stroke="#2a323d"/>
      <text x="${L-8}" y="${yH(v)+4}" text-anchor="end" fill="#6e7c8c" font-size="10">${m.fmt(v)}</text>`;
  }).join('');

  const bars = qs.map(q => {
    if (!q[metric]) return '';
    const held = q.shares > 0;
    return `<rect x="${x(ms(q.period)) - bw/2}" y="${yH(q[metric])}" width="${bw}"
      height="${H - B - yH(q[metric])}" fill="${held ? '#3f8ecc' : '#3a4553'}" rx="1.5">
      <title>${q.period}\n${m.label}: ${m.fmt(q[metric])}${q.implied_price
        ? '\nImplied price: $' + q.implied_price.toFixed(2) : ''}</title></rect>`;
  }).join('');

  // Gaps matter: a quarter the position was absent is a sale, not missing data.
  const gaps = qs.filter(q => !q.shares).map(q =>
    `<line x1="${x(ms(q.period))}" y1="${H-B}" x2="${x(ms(q.period))}" y2="${H-B+5}"
      stroke="#5a6472"/>`).join('');

  let line = '', axisR = '';
  if (price.length) {
    const pv = price.map(p => p.close);
    const lo = Math.min(...pv) * 0.94, hi = Math.max(...pv) * 1.06;
    const yP = v => H - B - (v - lo) / (hi - lo) * (H - B - T);
    const pts = price.map(p => `${x(ms(p.date)).toFixed(1)},${yP(p.close).toFixed(1)}`).join(' ');
    line = `<polyline points="${pts}" fill="none" stroke="var(--warn)" stroke-width="1.6"
      stroke-linejoin="round" opacity=".92"/>`;
    axisR = [lo, (lo+hi)/2, hi].map(v =>
      `<text x="${W-R+8}" y="${yP(v)+4}" fill="var(--warn)" font-size="10">$${
        v >= 100 ? Math.round(v) : v.toFixed(1)}</text>`).join('');
  }

  const years = [...new Set(qs.map(q => q.period.slice(0,4)))].map(y =>
    `<text x="${x(ms(y+'-01-01'))}" y="${H-8}" text-anchor="middle" fill="#6e7c8c"
      font-size="10">${y}</text>`).join('');

  return `<svg viewBox="0 0 ${W} ${H}">${grid}${bars}${gaps}${line}${axisR}${years}</svg>`;
}

function priceNote(rec) {
  if (rec.price_source === 'vendor') {
    const c = rec.price_check || {};
    return `Price: ${rec.ticker} daily close, split-adjusted. Ticker confirmed against
      this filing's own implied price (value ÷ shares) — worst gap
      ${c.worst_error_pct}% across ${c.quarters_checked} quarter-ends.` +
      (c.split_before ? ` Split detected on or before ${c.split_before}, so the price line is
      rebased where the share counts beside it are not.` : '');
  }
  return `Price: implied by the filing itself (value ÷ shares), quarter-ends only —
    ${rec.price_note ? esc(rec.price_note) + '. ' : 'no verified ticker mapping. '}
    This is BIT's own reported basis, not a vendor quote.`;
}

function detailPanel(cusip) {
  const rec = history.positions[cusip];
  if (!rec) return `<div class="note">No filing history for ${esc(cusip)}.</div>`;
  const held = rec.quarters.filter(q => q.shares);
  const peak = held.reduce((a, b) => a.pct > b.pct ? a : b, held[0]);
  return `<div class="ctrls" data-cusip="${cusip}">
      ${Object.entries(METRICS).map(([k, v]) =>
        `<button data-metric="${k}" class="${k === 'shares' ? 'on' : ''}">${v.label}</button>`).join('')}
      <span class="spacer"></span>
      <button data-price="1" class="on">Price ${rec.price_source === 'vendor'
        ? esc(rec.ticker) : '(implied)'}</button>
    </div>
    <div class="chartbox"></div>
    <div class="legend">First reported ${held[0].period} · peak weight
      ${peak.pct.toFixed(2)}% at ${peak.period} · ${held.length} of
      ${rec.quarters.length} quarters held. ${priceNote(rec)}</div>`;
}

/* A US ISIN embeds its CUSIP at characters 3-11, which is the only bridge
   between the ISIN-keyed statutory tables and the CUSIP-keyed 13F history.
   Non-US lines (Infineon, Auto1, SK Hynix) have no 13F row at all — that is the
   13F's blind spot, not missing data, so those rows simply do not expand. */
const cusipOf = isin => /^US/.test(isin || '') ? isin.slice(2, 11) : null;
const hasHistory = key => !!(key && history.positions[key]);

/* Rows expand on click; charts render lazily because there are 80+ of them. */
function attachExpanders(table) {
  table.addEventListener('click', e => {
    if (e.target.closest('.ctrls')) return;
    const tr = e.target.closest('tr.exp'); if (!tr) return;
    const next = tr.nextElementSibling;
    if (next && next.classList.contains('detail')) { next.remove(); tr.classList.remove('open'); return; }
    const row = table.tBodies[0].insertRow(tr.rowIndex);
    row.className = 'detail';
    const td = row.insertCell();
    td.colSpan = tr.cells.length;
    td.innerHTML = detailPanel(tr.dataset.cusip);
    tr.classList.add('open');
    draw(td, tr.dataset.cusip);
  });

  table.addEventListener('click', e => {
    const b = e.target.closest('.ctrls button'); if (!b) return;
    const box = b.closest('.detail');
    if (b.dataset.metric) {
      b.parentElement.querySelectorAll('[data-metric]').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
    } else {
      b.classList.toggle('on');
    }
    draw(box.querySelector('td'), b.closest('.ctrls').dataset.cusip);
  });
}

function draw(td, cusip) {
  const ctrls = td.querySelector('.ctrls');
  const metric = ctrls.querySelector('[data-metric].on').dataset.metric;
  const showPrice = ctrls.querySelector('[data-price]').classList.contains('on');
  td.querySelector('.chartbox').innerHTML = positionChart(history.positions[cusip], metric, showPrice);
}

/* ---------- overview ---------- */
const s = analysis.series, first = s[0], last = s[s.length - 1];
const avgTurn = (analysis.quarters.slice(-8).reduce((a, q) => a + q.name_turnover_pct, 0) / 8).toFixed(0);
const aumM = f => parseFloat(String(f.fund_assets).replace(/[^0-9.]/g, '')) || 0;
const totalFundAum = funds.reduce((a, f) => a + aumM(f), 0);

el('s-overview', `
<h2>What BIT Capital is</h2>
<p class="note">A Berlin technology-equity boutique founded in ${firm.founded} by Jan Beckers. ${firm.positioning}
They describe themselves as an <b>AI-native investment platform</b> — which matters for this case study:
the team we would be building for already runs a large alternative-data and LLM pipeline, and treats
signal generation as a core competence rather than a novelty.</p>

<div class="grid g4">
  <div class="card stat"><div class="k">Assets under management</div><div class="v">${firm.aum}</div>
    <div class="d">across ${funds.length} funds we could source</div></div>
  <div class="card stat"><div class="k">Positions we can see</div><div class="v">${views.total_positions}</div>
    <div class="d">${views.total_unique} unique securities · €${(views.total_value_eur/1e6).toFixed(0)}m</div></div>
  <div class="card stat"><div class="k">Top-10 concentration</div><div class="v">${last.top10_pct}%</div>
    <div class="d">of US-listed equity value</div></div>
  <div class="card stat"><div class="k">Quarterly name turnover</div><div class="v">${avgTurn}%</div>
    <div class="d">8-quarter average, entries + exits</div></div>
</div>

<h2>How they invest</h2>
<p class="note">Taken from their own description of the process. The eight steps below are their framing, not mine.</p>
<div class="grid g2">
  <div class="card"><ol class="steps">${firm.process.map(p =>
    `<li><b>${esc(p.step)}.</b> ${esc(p.detail)}</li>`).join('')}</ol></div>
  <div>
    ${firm.quotes.map(q => `<blockquote><p>“${esc(q.text)}”</p>
      <cite>— ${esc(q.attribution)}</cite></blockquote>`).join('')}
    <div class="card" style="margin-top:12px">
      <div class="k" style="color:var(--faint);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em">The platform, in their numbers</div>
      <dl class="kv" style="margin-top:10px">${firm.platform.map(p =>
        `<dt>${esc(p.metric)}</dt><dd style="font-family:inherit;color:var(--dim)">${esc(p.detail)}</dd>`).join('')}</dl>
    </div>
  </div>
</div>

<h2>Why the intelligence system matters to them</h2>
<p class="note">Three things in the data, rather than in their marketing, tell you what this fund needs.</p>
<div class="grid g2">
  <div class="card"><b>They turn the book over fast.</b>
    <p class="note" style="margin:8px 0 0">In the most recent quarter, ${analysis.quarters[analysis.quarters.length-1].n_entries}
    positions were opened and ${analysis.quarters[analysis.quarters.length-1].n_exits} closed —
    ${analysis.quarters[analysis.quarters.length-1].name_turnover_pct}% name turnover in three months.
    A fund that re-underwrites its portfolio this often needs early signal, not quarterly summaries.</p></div>
  <div class="card"><b>They are long the AI build-out, concretely.</b>
    <p class="note" style="margin:8px 0 0">The largest positions are compute, memory and networking —
    IREN, Micron, SanDisk, Marvell, TSMC, Silicon Motion, Ciena — not just model developers.
    A lab publishing something that changes inference cost or memory intensity lands directly on this book.</p></div>
  <div class="card"><b>Most of the labs are private, so the exposure is indirect.</b>
    <p class="note" style="margin:8px 0 0">There is no OpenAI or Anthropic line item. The connection runs through
    suppliers, infrastructure and second-order beneficiaries, which is exactly the mapping layer the case study
    asks for and the part that cannot be automated naively.</p></div>

  const cells = ['mtd','ytd','1y','3y','5y','since_inception'].map(k => {

  }).join('');
  return `<tr><td class="dim">${label}</td>${cells}</tr>`;
};

<h2>What this data cannot tell you</h2>
<div class="caveat"><b>The 13F is a partial view.</b> It covers US-listed long equity across all BIT vehicles
<i>combined</i>. It excludes non-US listings — SK Hynix, Infineon, Auto1, Zijin Mining all appear in the

<div class="caveat"><b>Everything is lagged.</b> 13F is filed 45 days after quarter end; the annual report is

<div class="caveat"><b>Tickers are checked, not trusted.</b> The filings give CUSIP and the annual report
gives ISIN; neither carries a ticker, and a guessed one would put a fabricated identifier into an investment
tool. So <code>config/tickers.yaml</code> hand-maps the names that carry the weight —

quarter-end must match the price the filing itself implies (value ÷ shares) to within
${history.price_tolerance_pct}%. A ticker that fails is dropped, and the position falls back to its
implied-price series — a missing price line rather than a wrong one. Splits are detected and excluded from
the check, because the vendor adjusts for them retroactively and the filings do not.</div>

factsheet's "Fund assets" is fund-level — checked against the statement, not assumed. Only the

// An open detail row would sort away from its parent and would match the filter
// on its own chart text, so collapse everything before either runs.
function collapseAll(tbl) {
  [...tbl.tBodies[0].rows].forEach(r => r.classList.contains('detail') && r.remove());
  tbl.querySelectorAll('tr.exp.open').forEach(r => r.classList.remove('open'));
}

['t1','t2'].forEach(id => sortable(document.getElementById(id)));
['t1','t2'].forEach(id => attachExpanders(document.getElementById(id)));
['t1','t2'].forEach(id => document.getElementById(id).querySelectorAll('th').forEach(
  th => th.addEventListener('click', () => collapseAll(document.getElementById(id)), true)));

[['q1','t1'],['q2','t2']].forEach(([qi, ti]) => {
  document.getElementById(qi).oninput = e => {
    const tbl = document.getElementById(ti);
    collapseAll(tbl);
    const v = e.target.value.toLowerCase();
    [...tbl.tBodies[0].rows].forEach(r =>
      r.style.display = r.textContent.toLowerCase().includes(v) ? '' : 'none');
  };
});
</script>
