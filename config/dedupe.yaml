# Near-duplicate collapse.
#
# The corpus surfaces one event several times. GPT-6 Astra arrived as seven rows
# between 2026-09-01 and 09-05 — a launch post, a forum restatement of it, an
# API docs page, a safety overview, a precursor and two customer stories — and a
# single repo ships four releases in five days. Each was scored independently
# and each took its own line in the feed.
#
# Three gates decide a merge, and only the third costs money. See
# docs/decisions.md for why mechanism overlap is not one of them: it encodes
# what *kind* of event an item is, not *which* event, so "TCS brings Claude to
# regulated industries" and "DXC integrates Claude" score a perfect 1.0 while
# being two entirely different partnerships.

version: 1

# Gate 0 — the exact pass. Same lab, same day, same title after punctuation is
# stripped, and the two rows merge free of charge whatever else disagrees.
#
# This is not an optimisation, it is a correctness fix. One article reaches us
# at two URLs — "Expanding Daybreak as the Cyber Defense Window Narrows" on
# openai.com and on community.openai.com, same day — and the classifier gave
# the two copies DIFFERENT event types (`incremental_model_release` and
# `product_launch`; "Introducing Intelligence Age" got `other` and
# `safety_policy`). The event-type gate below would therefore refuse to merge
# two copies of one text. Running exact first is what stops that.
#
# It is also the honest reading of that disagreement: it is classifier noise on
# identical input, not evidence the articles differ.
exact:
  match_on: [lab, published_on, title]

# Gate 1 — subject. Two items are about the same thing if they share a
# normalised model identifier (research/corpus/first_mention.py) and a lab,
# within this many days of each other.
#
# 14 days is wider than the 48h digest window on purpose: a precursor post and
# the launch it precedes are the case worth catching, and Astra's spanned four
# days. Widening it further mostly adds unrelated pairs from the same lab —
# measured at 4,412 candidate pairs across the 267 non-release articles at 14
# days, which is already far more than the LLM should ever see.
window_days: 14

# Gate 1b — the recall net. config/entities.yaml records its own gap: the
# identifier pattern "does NOT catch a genuinely novel product name carrying no
# version number". Cosine over the embedding matrix covers that case.
#
# What is embedded is title + classifier summary, never the body: bodies carry
# site chrome ("OpenAI Research Products Business Developers Company Foundation
# Log in Try ChatGPT" opens two different Astra articles) which lifts the
# similarity between any two pages from one lab regardless of content.
embedding:
  provider: openai        # Anthropic has no embeddings API
  model: text-embedding-3-small
  # Texts per API call. The whole corpus is ~700 items, so this is 8 calls.
  batch_size: 96

# Gate 3 — redundancy. Pairs at or above `cosine_high` merge without asking;
# below `cosine_low` they stay separate; only the band between them reaches the
# adjudicator, which is the only part that spends money per pair.
#
# From research/dedupe/calibrate.py over research/docs/dedupe_labels.json, not
# chosen by eye. Re-run it after any change to the labels or the embedded text.
#
# THE REASON THIS IS A BAND AND NOT A THRESHOLD: cosine does not separate the
# classes. Labelled positives run 0.763 to 0.966 and negatives reach 0.869, so
# every single cut is a bad trade — full recall lands at precision 0.38, full
# precision at recall 0.20. The band is drawn where the number stops deciding.
#
#   >= 0.87   no false merge in the labelled set — merge unasked
#   <  0.76   no true duplicate lost — separate unasked
#   between   the number genuinely does not know; ask the model
#
# The edges are asymmetric on purpose. A false merge deletes a claim from the
# product; a missed merge leaves a visible duplicate row. So the high edge is
# chosen on precision and the low edge on recall, rather than both on some
# blended score that would trade the two as if they cost the same.
#
# Sample caveat: 5 positives after the exact pass. One wrong label moves recall
# by 0.2. Indicative, not precise — the corpus genuinely contains few
# near-duplicates. See docs/decisions.md.
thresholds:
  cosine_high: 0.87
  cosine_low: 0.76

adjudication:
  provider: anthropic
  # Deliberately the same model the rest of the pipeline classifies with, and
  # deliberately NOT the model that labelled the calibration set: one model on
  # both sides would be marking its own homework and the regression floor in
  # tests/test_dedupe.py would mean nothing.
  model: claude-sonnet-5
  prompt_version: v1

# GitHub releases are 380 of 647 articles and never need a similarity check —
# a release train is identified by its repo. All releases from one repo inside
# this window collapse to one card, anchored on the highest ai_score.
#
# 48 hours matches config/digest.yaml's window so the feed and the digest agree
# about what one release event is.
releases:
  window_hours: 48
