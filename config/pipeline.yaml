# How the scheduled pipeline behaves. Config, not code.
#
# The numbers here are the ones a person would want to change at 2am without
# reading Python: what the run is allowed to spend, how often each leg is worth
# running, and when a failure stops being noise.

version: 1

# Cost runaway is a named failure mode (CLAUDE.md) that had no control at all
# until this file existed. A cron job making LLM calls against a EUR 100 budget
# is exactly where it bites, because nobody is watching when it fires.
#
# Calibration, from the real cost log (docs/cost.md, raw_costs): the classifier
# averages $0.025 per article measured over 583 calls. A normal incremental run
# classifies a handful of new articles and costs cents, so `per_run_usd` sits
# orders of magnitude above ordinary operation and still stops a loop or a
# prompt regression within one firing rather than one month.
#
# RAISED 5.00 -> 15.00 (2026-09-04). The old value claimed to admit a full
# re-classification of the corpus. That stopped being true as the corpus grew:
# at 250 articles a version bump costs ~$6.25, so the v8 bump (D52) would have
# aborted mid-stage under 5.00 and left a corpus split across two prompt
# versions -- the worst outcome, since it spends the money without producing
# the thing. 15.00 clears a full re-classification with room for the corpus to
# keep growing, and is still ~200x an ordinary nightly run, so it goes on
# catching a runaway within one firing.
#
# `per_month_usd` governs the slow leak, `per_run_usd` the blast radius of any
# one firing. See the note on the monthly value below for what it does and does
# not protect.
#
# The ceiling is denominated in USD because the provider bills in USD and the
# cost log records what was charged (docs/cost.md).
budget:
  per_run_usd: 15.00
  # Raised from 20.00 when drift went to the full 20-item gold set (D35): that
  # check is uncached by design and fires every run, so it is ~$0.75 nightly
  # (~$22/mo) on its own and would have crowded out classification -- the stage
  # that actually produces the product -- under the old ceiling.
  #
  # RAISED 75.00 -> 250.00 (2026-09-04), and this one is a deliberate change of
  # KIND, not degree. Be honest about what it now is: 250 USD is more than
  # double the EUR 100 project budget it was originally sized against, so it no
  # longer protects that budget. It is a runaway guard only -- it stops a loop
  # or a retry storm, it does not stop deliberate spending from exceeding what
  # can be reimbursed.
  #
  # The budget control that remains is a person reading docs/cost.md. That is a
  # weaker control than a number in a config file and is written down here so
  # nobody later reads 250.00 and assumes it was calibrated to something.
  per_month_usd: 250.00
  # abort_llm_stage: stop making calls, but keep everything already ingested and
  # let the ETL finish. The alternative (fail the whole run) would throw away
  # fetches that already happened and, worse, cost money to redo.
  on_exceed: abort_llm_stage

# Values are "run on every Nth firing"; 1 means every run.
#
# Everything runs every firing except GitHub. Staggering was rejected in general
# because it made a run's meaning depend on its own sequence number: "no new
# papers" on firing 8 meant "we did not look", which nothing downstream can tell
# apart from "nothing was published".
#
# GitHub is the exception because its leg is not a feed. Announcements and
# papers ask "what is new since last time" and a skipped firing loses items;
# GitHub re-derives contribution weight over a full 3-month history, so every
# run restates the whole picture and a skipped one loses nothing. It is also the
# only leg that costs 14 minutes of wall-clock (2,074 repos, measured run 12).
# Every 3rd firing keeps the history intact and the nightly run short.
# The kill switch. A leg set false is not fetched, not landed and not spent on
# -- including rows it ingested on earlier firings, which stay in bronze and
# would otherwise keep being classified. Separate from `cadence` because
# "never" and "every Nth firing" are different statements, and because this is
# the line to flip at 2am without reading any Python. It outranks cadence and
# an explicit --legs. A leg absent from this map defaults to on.
enabled:
  releases: true     # GitHub release notes as documents. Newest leg, and the
                     # one most likely to be switched off after a look at the
                     # output.

cadence:
  announcements: 1
  papers: 1
  github: 3
  releases: 1        # a release is news the day it ships, and the cursor makes
                     # a firing with nothing new cost one API call per repo
  # NIGHTLY, was weekly (7). The old comment argued that a daily firing would
  # "multiply the bill sevenfold", and at the time it was right: `fetch_posts`
  # wrote a watermark every firing and never read it, so every firing re-bought
  # the entire 90-day window no matter how often it ran. Cadence was the only
  # thing holding that cost down, so it had to be 7.
  #
  # D69 made the leg incremental -- the stored `max_published` is passed to X as
  # `start_time`, and X bills per post *returned*, applied server-side. A firing
  # now buys the days since the last one, not the window. That severs cost from
  # cadence and the sevenfold argument with it.
  #
  # What a daily firing actually costs, from the measured pull (docs/cost.md,
  # 2026-09-05: 473 posts billed over 90 days = ~5.3/day at $0.005):
  #
  #   weekly   1 firing  x (7 days + 1 overlap) x 5.3 x $0.005  = ~$0.21/wk
  #   nightly  7 firings x (1 day  + 1 overlap) x 5.3 x $0.005  = ~$0.37/wk
  #
  # ~$0.16 a week, ~$0.70 a month, to cut the worst-case lag on a post from 7
  # days to 1. Classification is unchanged: the overlap day's posts are already
  # in `raw_articles` and dedupe by URL before any model sees them.
  #
  # The overlap is why nightly is 1.75x and not 1x. The mark is a DATE, not an
  # instant, so each firing re-reads the day it stopped on -- deliberately, to
  # avoid dropping posts published later on that day. Seven firings re-read
  # seven days; one firing re-reads one.
  #
  # THIS NUMBER IS NOW LOAD-BEARING ON THAT WATERMARK. If the mark stops being
  # read, nightly re-buys the full 90-day window every night: ~473 posts x
  # $0.005 x 7 = ~$16.60 a week. `TestANightlyPostsCadenceRestsOnTheWatermark`
  # (tests/test_adapters.py) pins both halves and fails if the read is removed
  # while this is 1.
  posts: 1
  drift: 1

alerts:
  # Consecutive scheduled runs a source may fail before it is an incident
  # rather than noise (planning.md 4b). One firing down and back up is normal;
  # three in a row is not.
  source_down_runs: 3

  # Content alerts fire at or above this band. `high` is >= 60 on the
  # deterministic score (config/scoring.yaml).
  content_band: high

  # Minimum connection strength for a holding-impact content alert.
  content_min_strength: 0.5

  # A content alert says "the pipeline found something", which is a claim about
  # what a lab published recently -- so it is bounded by publication age, not
  # only by band. Without this the papers backfill alerts on OpenAI's 2023
  # GPT-4 technical report, correctly scored 100 and three years old.
  #
  # 120 days is measured, not chosen: the oldest high-band announcement in the
  # register is 89 days old (the announcements window is ~3 months), and the
  # newest backfilled paper is 132. The gap is wide, so this changes nothing
  # about announcement alerting today and still excludes every backfill item.
  #
  # The cost, stated: a genuinely important paper published four months ago and
  # discovered tonight does not alert. It is still scored, still in the UI and
  # still joined to holdings -- and the digest window (48h) would have excluded
  # it anyway. An alert is for what is new, and it is not.
  content_max_age_days: 120

  # Corpora that are scored and shown in the dashboard but may not raise a
  # content alert. `t1` and `t2` are the X posts leg: it is new, it is the
  # noisiest corpus in the system, and the cost of being wrong here is paging a
  # reader about a CEO's enthusiasm. Remove both from this list to turn posts
  # alerts on -- that is the whole change.
  #
  # BOTH versions, deliberately. The mute matches on `prompt_version`, so the
  # D70 flip from t1 to t2 would have switched posts alerts ON by omission --
  # a live version absent from this list is an unmuted one. t1's rows also
  # remain in `classifications`, so dropping it would unmute those too.
  content_mute_prompt_versions:
    - t1
    - t2

  # Gold-set agreement below this raises a *system* alert, not a content one:
  # a scorer quietly becoming less consistent is silent degradation, which is
  # a broken pipeline rather than a finding about the world (planning.md 6a).
  drift_agreement_floor: 0.80

  # stdout | webhook. The alerts table is the record of truth either way;
  # the channel is only delivery, and a delivery failure is recorded rather
  # than fatal. The webhook URL comes from ALERT_WEBHOOK_URL, never from here.
  channel: stdout

  # Everything raised is recorded; only delivery is capped. Without this the
  # first run over an existing corpus fires one notification per high-band
  # article already in it (16, today) and trains everyone to mute the channel.
  # Suppressed alerts say so in `delivery_error` rather than looking failed.
  max_deliveries_per_run: 10

classification:
  model: claude-sonnet-5
  workers: 12          # network-bound, not CPU-bound
  # Interactive by default. The Batches API is half price but polls to
  # completion, which suits a backfill and not a scheduled firing that has to
  # finish (planning.md 4a).
  batch: false

# How the papers harvesters talk to the outside world. Every value here exists
# because one of them was wrong on 2026-09-04 (docs/decisions.md D53): four of
# six papers sources failed in one firing when arXiv rate-limited the
# deployment's egress IP.
#
# The cache those harvesters relied on was a directory under
# `research/docs/*_cache/`, which is in .gitignore AND .dockerignore, and the
# cron has no disk. So the deployment never had a cache at all and replayed
# ~70 requests at arXiv every night. The cache now lives in Postgres
# (`fetch_cache`), which is the only store that survives a firing there.
fetch:
  # Seconds between two live requests to one host family. arXiv publishes a
  # one-request-per-three-seconds guideline and enforces it with 429s; this is
  # that number. `export.arxiv.org` and `arxiv.org` share the bucket because
  # they are one operator enforcing one limit -- keeping them separate is how
  # five harvesters each looked polite alone and were not in aggregate.
  min_interval_seconds:
    arxiv.org: 3.0
    # The posts leg reads this through research/posts/x_client.py rather than
    # through fetch_cache -- see that module for why an authenticated JSON API
    # cannot share the HTML fetcher -- but the per-host limit belongs in one
    # file, so it is configured here with everything else. X allows 300 requests
    # per 15 minutes and the leg makes about 28, so this is politeness rather
    # than a constraint we are near.
    api.x.com: 1.0
  # Everything else: labs' own sites, one request per second, which no lab has
  # ever objected to.
  default_min_interval_seconds: 1.0

  # How long a *discovery* URL's answer is trusted: API queries, paginated
  # listings, sitemaps. Immutable URLs -- a versioned arXiv id names a document
  # that is never edited -- ignore this and are cached permanently, which is
  # where nearly all the request volume was.
  #
  # This number is the trade between cost and lag, and it is the one value here
  # worth arguing about. 336 hours (14 days) applies to the ~36 title-resolution
  # queries -- "which arXiv paper is called X", asked about a title we already
  # have. Re-asking is what lets a byline change: the answer carries a versioned
  # id, so a paper that gains an author in v2 is only noticed when the lookup is
  # run again. Lower it if bylines start looking stale; the cost is linear.
  #
  # It no longer governs how fast a NEW paper is found -- see listing_ttl_hours.
  discovery_ttl_hours: 336

  # How long a *listing* is trusted: the URLs that are how we learn a paper
  # exists at all. Marked at the call site with `fetch_cache.LISTING`, because
  # it is the question that makes a URL a listing and not the URL's shape --
  # DeepSeek's `au:"DeepSeek-AI"` search and OpenAI's `ti:"..."` lookup hit the
  # same endpoint and only the first is discovery in this sense.
  #
  # 24 hours because the alternative was measured and is indefensible: DeepSeek
  # has no papers page, so `au:"DeepSeek-AI"` is the only route by which one of
  # its papers is ever found, and under the shared 336h it could go unseen for a
  # fortnight. There are only three of these URLs (DeepSeek's search, DeepMind's
  # sitemap, Meta's paginated index), so asking daily costs three requests a
  # night -- less than one percent of what the leg already spends.
  listing_ttl_hours: 24

  # Spread on the discovery TTL, as a fraction: 0.25 turns 336h into 336-420h,
  # picked per URL from a stable hash of it.
  #
  # This exists because the comment above used to claim these queries "re-run on
  # staggered expiry rather than all at once", and nothing staggered them. Every
  # discovery URL is first fetched in the same firing, so all ~36 lapsed in the
  # same firing, which replayed the whole set at arXiv in one burst and got the
  # egress IP rate-limited. Measured 2026-09-06: 35 cached rows, one expiry
  # date. Four papers sources then failed every night, because a failed fetch
  # caches nothing and so re-opens the same uncached query on the next firing.
  #
  # Only ever extends, never shortens, so the number above stays the floor it
  # reads as. The cost is stated plainly: a title lookup can now be up to 17.5
  # days stale rather than 14. Set to 0 to disable and get the old behaviour.
  discovery_ttl_jitter: 0.25

  # Attempts before a source is recorded as failed. A lost source is a partial
  # run, not a dead one (D27), so this is deliberately small: sitting in a
  # retry loop against a rate-limited address does not help and only makes the
  # firing longer.
  retries: 4
  # Ceiling on any single backoff, including one the server asks for via
  # Retry-After. Stops a misbehaving `Retry-After: 86400` hanging the run.
  max_backoff_seconds: 120.0

# How far back the dashboard renders. A READ cut, not an ingestion or
# classification one: nothing here changes what is fetched, stored or scored.
#
# WHY IT IS NEEDED. `releases_backfill: 5` (config/repo_signals.yaml) takes the
# five most recent releases of every watched repository, and for a repository
# that stopped shipping years ago those five are years old. Measured on the live
# corpus: 186 of 380 releases predate this window and the oldest is 2019-06-26,
# against announcements where 260 of 267 already sit inside it. So this is a
# releases-and-papers cut in practice; the announcements leg never needed one.
#
# 90 days matches the horizon the rest of the product already assumes -- the
# GitHub commit harvest window and `repo_signals.new_within_days` both describe
# recent activity, and a lab's release from 2021 is not intelligence about what
# it is doing now.
#
# WHAT IT DOES NOT TOUCH, DELIBERATELY:
#
# * `app/digest.py` already windows to 48 hours (config/digest.yaml), so an
#   edition is unaffected by this number.
# * `research/corpus/first_mention.py` reads `raw_articles` directly and keeps
#   the whole archive. Firstness is a claim about the entire corpus, so
#   truncating its input would make it WRONG rather than merely narrower: a name
#   whose earliest document fell outside the window would be reported as new
#   when it is not. That module has its own `new_within_days` for reporting.
# * Grouping and pairing run over the full corpus. An out-of-window document is
#   still evidence about an in-window one.
display:
  corpus_window_days: 90
