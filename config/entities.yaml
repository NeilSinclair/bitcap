# Entities tracked for first-mention detection.
#
# The question this answers is not "what does this document say" -- an LLM
# already reads for that -- but "have we ever seen this name before". Firstness
# is a property of the corpus, not of any one document, so no per-document read
# can recover it however the prompt is worded. It is set arithmetic, it costs
# nothing, and it runs over every source at once.
#
# Why it exists: `openai/codex` rust-v0.153.1 announced GPT-6-Astra as a
# configuration option and was correctly scored low-impact, because that is what
# the document says. The significance was that the string had never appeared
# anywhere before. See docs/decisions.md.

version: 1

# A name whose earliest appearance across the whole corpus falls inside this
# many days is reported as a first mention. Everything older is an established
# name that happens to be mentioned again.
#
# This is what separates GPT-6-Astra from the `llama-3.1` references in
# meta-llama cookbook releases dated 2024, which are the dominant noise class.
new_within_days: 120

# Model-identifier families. A match is a family word followed by a version
# number, so this catches a new *version or variant of a family we know* --
# `gpt-6-astra`, `claude-6`, `llama-5`. It does NOT catch a genuinely novel
# product name carrying no version number; that gap is real and is recorded in
# docs/decisions.md rather than papered over.
#
# Adding a family is a config change. `o` (o1, o3) is deliberately absent: a
# single letter followed by a digit matches far too much ordinary prose.
model_families:
  - gpt
  - claude
  - sonnet
  - opus
  - haiku
  - llama
  - grok
  - gemini
  - gemma
  - deepseek
  - mistral
  - mixtral
  - codestral
  - pixtral
  - qwen
  - phi

# Version numbers with more parts than this are rejected as software semver
# rather than model versions. This is what separates Claude `haiku` from
# google-deepmind's `haiku` neural-network library, whose releases are tagged
# `haiku-0.0.7` -- a real entity-resolution collision between a model name and
# a package name, caught by the shape of the number rather than by a denylist.
max_version_parts: 2

# Exact identifiers never reported, lowercased. For collisions the version
# shape cannot separate. Kept deliberately short: a long denylist means the
# extraction rule is wrong and should be fixed instead.
#
# `sonnet-2` is DeepMind's neural-network library, not Anthropic's model.
# `google-deepmind/sonnet` v2.0.0 through v2.0.2 are in the corpus, and the
# entity-resolution collision CLAUDE.md names as an expected failure mode.
#
# BE PRECISE ABOUT WHERE IT BITES, because the obvious reading is wrong and cost
# us a test that could not fail. The release *titles* -- "google-deepmind/sonnet
# v2.0.1" -- extract nothing at all: `max_version_parts: 2` rejects a three-part
# version, with or without this entry. It is the release *bodies* that say
# "Sonnet 2", which is a well-formed identifier the pattern does match and
# nothing else can separate from Anthropic's.
#
# Denying the exact key costs nothing real: Anthropic never shipped a "Sonnet
# 2", so this key has no true positives to lose.
deny:
  - sonnet-2

# How many of the star ranking the unannounced-repository pass checks. Here
# rather than as a CLI default so the two knobs that decide what gets looked at
# live in config together.
unannounced_top: 40

# NOTE: there is no `corpora` list here any more. The corpus is `raw_articles`,
# read in one query, so this file no longer decides *what* is scanned -- only
# how identifiers are recognised in it. Which fields of a document count as
# primary-source text is a property of the document, not of a config entry, and
# lives in `first_mention.text_fields`: a release item's title is built by this
# pipeline and must never reach a quote or the unannounced-repository text.
