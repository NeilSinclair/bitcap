  - isin: US67066G1040
    name: NVIDIA Corporation
    ticker: NVDA
    ticker_verified: false
    exchange: Nasdaq
    country: United States
    held_by: [Technology Leaders, Global Leaders, Defensive Growth, Multi Asset]
    weight_technology_leaders: 2.54

    what_it_does: >
      Designs the accelerators most frontier training and inference runs on, plus
      the networking (NVLink, Spectrum, InfiniBand) and the CUDA software layer
      that makes them hard to leave. Sells increasingly at rack scale — Vera Rubin
      is a system, not a chip.

    revenue_model: >
      Sells GPUs, systems and networking to hyperscalers, neoclouds and
      enterprises, overwhelmingly through Data Center. Fabless: TSMC manufactures,
      memory comes from SK Hynix, Micron and Samsung. Customer concentration is
      extreme and the buyers are the same labs this system tracks.

    financials:
      as_of: Q2 FY2027, quarter ended 2026-07-26
      revenue_usd_m: 96221
      revenue_yoy_pct: 106
      gaap_gross_margin_pct: 75.0
      gaap_operating_margin_pct: 66.2
      diluted_eps_usd: 2.46
      capex_usd_m: 2677
      segments:
        - {name: Data Center, revenue_usd_m: 89000, yoy_pct: 117}
        - {name: Edge Computing, revenue_usd_m: 7200, yoy_pct: 27}
      derived:
        datacenter_share_of_revenue_pct: 92.5
        note: Data Center as a share of total revenue. Operating margin is GAAP operating income over revenue.
      source: https://www.sec.gov/Archives/edgar/data/1045810/000104581026000073/q2fy27pr.htm

    ai_role: primary
    ai_role_reason: >
      92.5% of revenue is Data Center and it grew 117% year on year. There is no
      part of this business that is not an AI business.

    mechanisms:
      - id: training_compute_up
        sign: positive
        magnitude: high
        confidence: high
        why: >
          Every frontier training cluster announced by a lab is priced in NVIDIA
          accelerators unless it explicitly names custom silicon. The most direct
          link in the portfolio.
      - id: inference_volume_up
        sign: positive
        magnitude: high
        confidence: high
        why: >
          Management framed the quarter as inference-led — "compute is revenue" —
          and shipped Groq 3 LPX, a dedicated interactive inference accelerator.
      - id: ai_capex_investments
        sign: positive
        magnitude: high
        confidence: high
        why: >
          Revenue is the capex line of its customers. NVIDIA has gone further and
          is helping fund it: partnerships with Apollo, BlackRock, Blackstone,
          Brookfield, Goldman Sachs and KKR to mobilise over $500 billion of
          third-party capital for AI infrastructure.
      - id: networking_bandwidth_up
        sign: positive
        magnitude: medium
        confidence: high
        why: >
          Spectrum-6 switch systems supporting pluggable and co-packaged optics
          ship as part of Vera Rubin, so rack-scale bandwidth is NVIDIA revenue
          rather than only a cost to it.
      - id: custom_silicon_substitution
        sign: negative
        magnitude: medium
        confidence: medium
        why: >
          Every lab TPU, Trainium or Broadcom-designed inference part is a socket
          NVIDIA does not fill. Medium rather than high because total accelerator
          demand is still growing faster than the substitution.
      - id: export_controls
        sign: negative
        magnitude: medium
        confidence: high
        why: >
          The Q3 FY2027 outlook of $108 billion explicitly assumes no Data Center
          compute revenue from China at all. The exposure is disclosed and
          currently assumed to be zero, which caps downside but confirms the loss.

    tailwinds:
      - claim: >
          Q3 FY2027 revenue guided to $108.0 billion +/- 2%, against $96.2 billion
          delivered — sequential growth guided to continue at scale.
        source: https://www.sec.gov/Archives/edgar/data/1045810/000104581026000073/q2fy27pr.htm
      - claim: >
          Gross margin 75.0%, up 2.6 points year on year, while revenue doubled —
          pricing power has not eroded with volume.
        source: https://www.sec.gov/Archives/edgar/data/1045810/000104581026000073/q2fy27pr.htm
      - claim: >
          Demand has broadened beyond one buyer: "This time last year, one lab
          alone was driving the buildout; today... multiple frontier labs scaling
          in parallel" (Jensen Huang).
        source: https://www.sec.gov/Archives/edgar/data/1045810/000104581026000073/q2fy27pr.htm

    headwinds:
      - claim: >
          Outlook assumes zero Data Center compute revenue from China, so any
          re-tightening elsewhere has no offset already assumed away.
        source: https://www.sec.gov/Archives/edgar/data/1045810/000104581026000073/q2fy27pr.htm
      - claim: >
          Accounts receivable rose $22.3 billion in the quarter against $96.2
          billion of revenue, and inventories rose $5.8 billion — growth is being
          carried on the balance sheet.
        source: https://www.sec.gov/Archives/edgar/data/1045810/000104581026000073/q2fy27pr.htm
      - claim: >
          Customer concentration in a handful of buyers who are simultaneously
          funding their own custom silicon programmes.
        unverified: Directional judgement; the 10-Q concentration table was not read for this entry.

    peers_in_portfolio:
