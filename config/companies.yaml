      source: research/docs/13f_raw (SEC Form 13F-HR, derived)

  - isin: US8740391003
    name: Taiwan Semiconductor Manufacturing Company Limited
    ticker: TSM
    ticker_verified: false
    exchange: NYSE (ADR); Taiwan Stock Exchange 2330
    country: Taiwan
    held_by: [Technology Leaders, Global Leaders, Aggressive Growth, Defensive Growth, Multi Asset]
    weight_technology_leaders: 4.84

    what_it_does: >
      Manufactures the leading-edge logic almost every AI accelerator is made on —
      NVIDIA, AMD, Broadcom-designed custom parts, Apple silicon — plus the
      advanced packaging (CoWoS) that attaches HBM to a die. Effectively the only
      supplier at the leading node.

    revenue_model: >
      Pure-play foundry: sells wafer capacity and packaging, priced by node.
      Because it serves both merchant GPU vendors and every custom-silicon
      programme competing with them, it is largely indifferent to which one wins.

    financials:
      as_of: Q2 2026, quarter ended 2026-06-30
      currency: USD headline; statutory figures in NT$
      revenue_usd_m: 40200
      revenue_yoy_pct: 33.7
      gaap_gross_margin_pct: 67.7
      gaap_operating_margin_pct: 60.3
      diluted_eps_usd: 4.31
      eps_note: US$4.31 per ADR unit; NT$27.25 per share.
      segments:
        - {name: High Performance Computing, revenue_ntd_m: 830369, share_of_revenue_pct: 65.4}
        - {name: Smartphone, revenue_ntd_m: 283279, share_of_revenue_pct: 22.3}
        - {name: Internet of Things, revenue_ntd_m: 64054, share_of_revenue_pct: 5.0}
        - {name: Automotive, revenue_ntd_m: 53663, share_of_revenue_pct: 4.2}
      derived:
        hpc_share_of_revenue_pct: 65.4
        hpc_share_prior_year_pct: 60.1
        advanced_nodes_share_of_wafer_revenue_pct: 77
        note: >
          HPC share computed from the platform table (NT$830,369m of NT$1,270,380m).
          Prior-year comparison NT$561,155m of NT$933,792m. "Advanced" is 7nm and below.
      source: https://www.sec.gov/Archives/edgar/data/1046179/000104617926000451/a2q26e_withguidancexfinal.htm
      segment_source: https://www.sec.gov/Archives/edgar/data/1046179/000104617926000541/a2026q2consolidatedreport-.htm

    ai_role: primary
    ai_role_reason: >
      High Performance Computing is 65.4% of revenue, up from 60.1% a year ago,
      and 2-nanometer reached 3% of wafer revenue in its first quarter of shipment.
      The AI mix is rising and the leading node is where it lands.

    mechanisms:
      - id: training_compute_up
        sign: positive
        magnitude: high
        confidence: high
        why: >
          Every accelerator in every announced cluster is a TSMC wafer plus CoWoS
          packaging, whoever designed it.
      - id: ai_capex_investments
        sign: positive
        magnitude: high
        confidence: high
        why: >
          HPC is 65.4% of revenue and rising. Committed datacentre spending
          converts into leading-edge wafer starts with a lag of a few quarters.
      - id: custom_silicon_substitution
        sign: positive
        magnitude: medium
        confidence: high
        why: >
          Uniquely in the portfolio, TSMC is positive on both sides: a lab TPU or
          Trainium part displaces an NVIDIA GPU but is fabricated in the same
          fabs. Substitution changes the customer name, not the wafer demand.
      - id: memory_intensity_up
        sign: positive
        magnitude: medium
        confidence: medium
        why: >
          TSMC does not make DRAM, but CoWoS advanced packaging attaches HBM
          stacks to logic die and is a TSMC-supplied, capacity-constrained step.
          Medium because the revenue is packaging, not the memory itself.
      - id: export_controls
        sign: mixed
        magnitude: medium
        confidence: medium
        why: >
          Restrictions cut Chinese customers but concentrate leading-edge demand
          in customers TSMC already serves. Direction depends on the measure, and
          the larger exposure is geopolitical rather than commercial.

    tailwinds:
      - claim: >
          Q3 2026 guided to US$44.6-45.8 billion against US$40.20 billion
          delivered, with gross margin guided to 65-67%.
        source: https://www.sec.gov/Archives/edgar/data/1046179/000104617926000451/a2q26e_withguidancexfinal.htm
      - claim: >
          Advanced technologies (7nm and below) were 77% of total wafer revenue;
