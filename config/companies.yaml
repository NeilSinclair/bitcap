        source: https://www.sec.gov/Archives/edgar/data/1046179/000104617926000451/a2q26e_withguidancexfinal.htm
      - claim: >
          HPC platform revenue grew from NT$561,155m to NT$830,369m year on year,
          taking its share of revenue from 60.1% to 65.4%.
        source: https://www.sec.gov/Archives/edgar/data/1046179/000104617926000541/a2026q2consolidatedreport-.htm

    headwinds:
      - claim: >
          Gross margin guidance of 65-67% is below the 67.7% delivered, on an
          assumed rate of NT$32 to the dollar — margin is exposed to the currency.
        source: https://www.sec.gov/Archives/edgar/data/1046179/000104617926000451/a2q26e_withguidancexfinal.htm
      - claim: >
          Concentration of leading-edge capacity in Taiwan is a single-point
          geopolitical exposure that no operating result reflects.
        unverified: Structural judgement, not a disclosed risk figure.

    peers_in_portfolio:
