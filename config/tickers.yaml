# CUSIP -> ticker, for fetching a price series to sit behind the holding history.
#
# These mappings are model knowledge, not a licensed security master, so none of
# them is trusted on faith. research/position_history.py verifies each one by
# comparing the vendor's close on each 13F quarter-end against the price implied
# by the filing itself (value_usd / shares). A ticker that does not reconcile is
# rejected and the position falls back to its implied-price series.
#
# That check is why this file is safe to hand-write: a wrong ticker produces no
# price line rather than a wrong price line. Entity-resolution collisions are a
# named failure mode, and a silently mismatched ticker is exactly one.
#
# Coverage is deliberately partial — the names that carry the weight. Anything
# absent simply renders its implied-price series.
#
# Keys are quoted, and that is not cosmetic. Unquoted, YAML reads an all-digit
# CUSIP as an integer, and one with a leading zero as OCTAL: 023135106 silently
# became 5028422. Sixteen identifiers were corrupted this way and the only
# symptom was a missing price line. The loader now rejects anything that is not
# a 9-character CUSIP rather than relying on the quotes surviving an edit.

version: 1

