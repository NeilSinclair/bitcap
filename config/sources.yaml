# Announcement sources: where each lab publishes, and how reachable it is.
#
# Adding a lab or a channel is a config change, not a code change. Each entry
# names a discovery method that fetch_announcements.py implements; the fetcher
# refuses an unknown method rather than guessing.
#
# `text_source` is not decorative. It records what the scorer actually read, so
# a score computed from a two-line RSS summary is never compared against one
# computed from a full article without the difference being visible. Every item
# on the output page carries this field.
#
# Scope: D7's deep-coverage register (docs/decisions.md), now seven labs
# after D14 added Meta AI. All seven are configured. xAI (`method:
# wayback_cdx`) discovers via the Internet Archive's CDX API rather than a
# live fetch -- live x.ai is fully Cloudflare-blocked, including
# sitemap.xml itself -- see that entry's own notes for why a sitemap-via-
# Wayback approach was tried first and abandoned (the archived sitemap
# copy is stale, would miss every in-window article).

version: 1
window_months: 3

labs:
  - id: anthropic
    label: Anthropic
    method: sitemap
    index_url: https://www.anthropic.com/sitemap.xml
    url_contains: /news/
    text_source: full_text
    date_from: page
    notes: >
      No RSS feed exists (rss.xml, news/rss.xml and feed.xml all 404). The
      sitemap carries lastmod, which is a modification date rather than a
      publication date, so it is used only as a coarse prefilter and the real
      date is read from the page.

  - id: openai
    label: OpenAI
    method: rss
    index_url: https://openai.com/blog/rss.xml
    text_source: rss_summary
    date_from: feed
    backfill: wayback
    notes: >
      openai.com is behind Cloudflare bot protection: the news index, article
      pages and WebFetch all return 403. Re-probed 2026-09-01 -- plain curl, a
      browser user agent, a full browser header set and a Googlebot user agent
      all still 403. sitemap.xml and news/rss.xml return 200, so XML is served
      and HTML is not. Discovery therefore stays on RSS.

      Full text is recovered afterwards from the Internet Archive by
      backfill_openai.py, which the `backfill` key above selects. Measured on
      the 3-month register: 141 of 152 articles are archived (93%), and the
      recovered text runs 15x to 55x the RSS summary. Recovered items carry
      `text_source: full_text_archived` and an `archive_snapshot` URL, so a
      score computed from an archived page is never silently mixed with one
      computed from a live fetch.

      The 11 unarchived items are customer stories and help-centre pages, the
      lowest-value part of the feed. They stay on `rss_summary`.

      Rate limit: the archive is the constraint, not us. Six concurrent probes
      returned errors on 20 of 24; backfill_openai.py fetches serially with a
      2s delay and exponential backoff. Snapshot discovery uses one bulk CDX
      wildcard query rather than one lookup per URL.
    also:
      - method: model_index
        enabled: true
        index_url: https://developers.openai.com/api/docs/models.md
        notes: >
          Second discovery channel, because the RSS feed is not complete and
          fails silently when it is not. GPT-6 Astra launched 2026-09-03 and
          openai.com/index/gpt-6-astra appeared in neither news/rss.xml nor
          any of the 37 child sitemaps -- only the satellite posts did
          (path-to-astra, safety-overview-gpt-6-astra, and the customer
          stories). The register recorded the launch day as routine while
          every fetch in the run reported success.

          developers.openai.com is not behind the apex's Cloudflare rule:
          probed 2026-09-04, the Markdown index returns 200 to plain urllib
          where openai.com/news/ returns 403. Markdown is a published
          interface -- the pages advertise `.md` variants and an llms.txt
          index -- so this is a supported surface, not a scrape workaround,
          and it needs no HTML stripping.

          A model spec page has no publication date, so "new" means "not in
          research/docs/model_index_baseline.json and not already stored",
          dated by first sight and labelled `date_basis: first_seen`. The
          baseline is committed rather than written at runtime: the deployed
          shape has no disk, so runtime state would reset on deploy and
          re-emit all 96 models. gpt-6-astra is deliberately absent from the
          baseline so the first run after this change emits it.
      - method: discourse
        enabled: true
        index_url: https://community.openai.com/c/announcements/6.json
        notes: >
          Third channel. OpenAI's developer forum is staff-authored, dated,
          served as JSON and not behind the apex's Cloudflare rule. It carried
          the GPT-6 Astra launch at 19:51 on 2026-09-03 with a link to
          openai.com/index/gpt-6-astra -- a post that reached neither the RSS
          feed nor any sitemap.

          The forum topic is the citation, not the openai.com link it
          contains. The topic URL is one this pipeline can fetch and
          re-verify; the canonical page returns 403 to everything we can send,
          and a citation we cannot resolve is not allowed to be the citation.
          The canonical link is kept as `canonical_url` so the real
          announcement is never lost.

          Coverage is narrow and that is expected: three posts in the ten days
          to 2026-09-04, all developer-facing. It catches launches, not policy
          or programme posts -- `the-defense-factory`, published the same
          night, is not there and is not reachable from any machine-readable
          OpenAI surface.

          Set `enabled: false` to turn this channel off without deleting the
          entry or the reasoning behind it.

  - id: deepseek
    label: DeepSeek
    method: sitemap
    index_url: https://api-docs.deepseek.com/sitemap.xml
    url_contains: /news
    text_source: full_text
    date_from: slug
    notes: >
      Publishes release notes to its API docs site. The sitemap has no usable
      lastmod, but slugs encode the date (news260821 = 2026-08-21; pre-2025
      slugs are MMDD). Only 17 items exist in total, which matches the sparse
      publication cadence found in the papers research.

  - id: google-deepmind
    label: Google DeepMind
    method: sitemap
    index_url: https://deepmind.google/sitemap.xml
    url_contains: /blog/
    text_source: full_text
    date_from: page
    notes: >
      Not blocked -- plain fetch of the blog index, sitemap and article pages
      all return 200. An RSS feed also exists (blog/rss.xml) but the sitemap
      was chosen for parity with Anthropic's proven path. The sitemap's
      <lastmod> is present per entry but still only used as a coarse
      prefilter, same reasoning as Anthropic: it is a modification date, not
      a publication date, so the real date is read from the page. Some
      article URLs 302-redirect off-domain to blog.google; urllib follows
      redirects by default, so this needed no new fetch-layer code.

  - id: mistral
    label: Mistral AI
    method: rss
    index_url: https://mistral.ai/news/rss
    text_source: full_text
    date_from: feed
    notes: >
      Not blocked. RSS discovery was chosen over the sitemap because the feed
      is already English-only (the sitemap enumerates /fr/news/ duplicates
      that would need filtering out) and gives a clean pubDate directly.
      `from_rss` now fetches each item's own page for the real article text
      when `text_source: full_text` is set (previously the RSS path only ever
      returned the feed's title+summary, silently mislabelled as whatever
      text_source the config claimed -- fixed alongside this entry) rather
      than adding a second, sitemap-based lab entry.

  - id: meta-ai
    label: Meta AI
    method: listing_pagination
    index_url: https://ai.meta.com/blog/
    page_param: page
    url_contains: /blog/
    text_source: full_text
    date_from: page
    user_agent: ""
    notes: >
      No RSS feed at any path tried. Sitemap is gated to named crawler UAs
      only -- robots.txt explicitly allows facebookexternalhit and
      meta-externalads, 403 for everyone else, confirmed live. Discovery
      instead paginates the plain blog listing (ai.meta.com/blog/?page=N).

      Confirmed live, and the opposite of every other lab here: a plain
      fetch with no custom User-Agent gets 200; any browser-style
      User-Agent gets 400. Hence the empty `user_agent` override, which
      `from_listing_pagination`/`fetch` read as "send no override, let
      urllib use its own non-browser-shaped default."

      No structured date metadata found on article pages (no OpenGraph
      tags, no JSON-LD) -- date is read from visible page text, same regex
      every page-sourced lab already uses.

  - id: xai
    label: xAI / SpaceXAI
    method: wayback_cdx
    index_url: https://x.ai/news
    url_contains: /news/
    text_source: full_text_archived
    date_from: page
    notes: >
      Live x.ai is fully Cloudflare-blocked on every path, including
      sitemap.xml itself, confirmed repeatedly across this project.
      Discovery goes through the Internet Archive's CDX API instead of a
      live fetch -- not just full-text recovery for an already-known URL
      the way backfill_openai.py uses it, but discovery itself.

      The originally planned method (fetch x.ai's own sitemap via its
      archived copy) does not work: confirmed live that
      x.ai/sitemap.xml has not been re-archived since February 2026, so
      its URL list would miss every article actually inside a 3-month
      window. Uses a direct CDX wildcard query on the article path instead
      (x.ai/news*), which finds real recent snapshots regardless of
      whether the sitemap itself was ever re-crawled.

      A snapshot's crawl date has no relationship to the article's publish
      date -- confirmed live, e.g. a 2024-dated funding-round page was
      recrawled in August 2026, completely ordinary archive behaviour.
      Every candidate is therefore dated from its own JSON-LD
      datePublished field, never from the CDX timestamp.

      Site brand is "SpaceXAI" as of the February 2026 SpaceX acquisition
      (D14), rendered even on old pages' titles since a page's <title> is
      generated at crawl time, not publish time -- both "SpaceXAI" and the
      earlier "xAI" suffix are stripped from titles regardless of an
      article's own age.
