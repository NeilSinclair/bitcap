# Announcement sources: where each lab publishes, and how reachable it is.
#
# Adding a lab or a channel is a config change, not a code change. Each entry
# names a discovery method that fetch_announcements.py implements; the fetcher
# refuses an unknown method rather than guessing.
#
# `text_source` is not decorative. It records what the scorer actually read, so
# a score computed from a two-line RSS summary is never compared against one
# computed from a full article without the difference being visible. Every item
# on the output page carries this field.
#
# Scope: D7's deep-coverage register (docs/decisions.md), now seven labs
# after D14 added Meta AI. All seven are configured. xAI (`method:
# wayback_cdx`) discovers via the Internet Archive's CDX API rather than a
# live fetch -- live x.ai is fully Cloudflare-blocked, including
# sitemap.xml itself -- see that entry's own notes for why a sitemap-via-
# Wayback approach was tried first and abandoned (the archived sitemap
# copy is stale, would miss every in-window article).

version: 1
window_months: 3

labs:
  - id: anthropic
    label: Anthropic
    method: sitemap
    index_url: https://www.anthropic.com/sitemap.xml
    url_contains: /news/
    text_source: full_text
    date_from: page
    notes: >
      No RSS feed exists (rss.xml, news/rss.xml and feed.xml all 404). The
      sitemap carries lastmod, which is a modification date rather than a
      publication date, so it is used only as a coarse prefilter and the real
      date is read from the page.

  - id: openai
    label: OpenAI
    method: rss
    index_url: https://openai.com/blog/rss.xml
    text_source: rss_summary
    date_from: feed
    backfill: wayback
    notes: >
      openai.com is behind Cloudflare bot protection: the news index, article
      pages and WebFetch all return 403. Re-probed 2026-09-01 -- plain curl, a
      browser user agent, a full browser header set and a Googlebot user agent
      all still 403. sitemap.xml and news/rss.xml return 200, so XML is served
      and HTML is not. Discovery therefore stays on RSS.

      Full text is recovered from the Internet Archive during the fetch, by
      `enrich_wayback` in fetch_announcements.py, which the `backfill` key
      above selects. Inside the fetch is load-bearing, not incidental: the
      fetch rewrites the register from scratch, so recovery run afterwards
      lasts exactly until the next fetch. It was, once, and 141 recovered
      articles reverted to summaries overnight with nothing reporting it
      (decisions.md D55). Measured 2026-09-05: 131 of 149 articles are
      archived (88%), and the recovered text runs 12x to 98x the RSS summary.
      Recovered items carry `text_source: full_text_archived` and an
      `archive_snapshot` URL, so a score computed from an archived page is
      never silently mixed with one computed from a live fetch.

      The 18 unarchived items are mostly customer stories, policy posts and
      academy pages -- the lowest-value part of the feed. They stay on
      `rss_summary`, and each is reported as an `unresolved` row rather than
      passing quietly. One exception is worth knowing about:
      safety-overview-gpt-6-astra is substantive and the archive has never
      crawled it.

      An article settles once it is classified, which happens in the firing
      that discovers it, so enrichment gets one attempt per article. Anything
      the archive has not crawled within that window keeps its summary
      permanently. Closing that needs either Save Page Now or not settling a
      summary-only article -- see decisions.md D55.

      Rate limit: the archive is the constraint, not us. Six concurrent probes
      returned errors on 20 of 24; `fetch_wayback` fetches serially with a 2s
      delay and exponential backoff. Snapshot discovery uses one bulk CDX
      query per path prefix rather than one lookup per URL, falling back to a
      single exact lookup only for the URLs that bulk query misses -- the
      wildcard index lags the exact one and silently omits recent captures.
    also:
      - method: model_index
        enabled: true
        index_url: https://developers.openai.com/api/docs/models.md
        notes: >
          Second discovery channel, because the RSS feed is not complete and
          fails silently when it is not. GPT-6 Astra launched 2026-09-03 and
          openai.com/index/gpt-6-astra appeared in neither news/rss.xml nor
          any of the 37 child sitemaps -- only the satellite posts did
          (path-to-astra, safety-overview-gpt-6-astra, and the customer
          stories). The register recorded the launch day as routine while
          every fetch in the run reported success.

          developers.openai.com is not behind the apex's Cloudflare rule:
          probed 2026-09-04, the Markdown index returns 200 to plain urllib
          where openai.com/news/ returns 403. Markdown is a published
          interface -- the pages advertise `.md` variants and an llms.txt
          index -- so this is a supported surface, not a scrape workaround,
          and it needs no HTML stripping.

          A model spec page has no publication date, so "new" means "not in
          research/docs/model_index_baseline.json and not already stored",
          dated by first sight and labelled `date_basis: first_seen`. The
          baseline is committed rather than written at runtime: the deployed
          shape has no disk, so runtime state would reset on deploy and
          re-emit all 96 models. gpt-6-astra is deliberately absent from the
          baseline so the first run after this change emits it.
      - method: discourse
        enabled: true
        index_url: https://community.openai.com/c/announcements/6.json
        notes: >
          Third channel. OpenAI's developer forum is staff-authored, dated,
          served as JSON and not behind the apex's Cloudflare rule. It carried
          the GPT-6 Astra launch at 19:51 on 2026-09-03 with a link to
          openai.com/index/gpt-6-astra -- a post that reached neither the RSS
          feed nor any sitemap.

          The forum topic is the citation, not the openai.com link it
          contains. The topic URL is one this pipeline can fetch and
          re-verify; the canonical page returns 403 to everything we can send,
          and a citation we cannot resolve is not allowed to be the citation.
          The canonical link is kept as `canonical_url` so the real
          announcement is never lost.

          Coverage is narrow and that is expected: three posts in the ten days
          to 2026-09-04, all developer-facing. It catches launches, not policy
          or programme posts -- `the-defense-factory`, published the same
          night, is not there and is not reachable from any machine-readable
          OpenAI surface.

          Set `enabled: false` to turn this channel off without deleting the
          entry or the reasoning behind it.

  - id: deepseek
    label: DeepSeek
    method: sitemap
    index_url: https://api-docs.deepseek.com/sitemap.xml
    url_contains: /news
    text_source: full_text
    date_from: slug
    notes: >
      Publishes release notes to its API docs site. The sitemap has no usable
      lastmod, but slugs encode the date (news260821 = 2026-08-21; pre-2025
      slugs are MMDD). Only 17 items exist in total, which matches the sparse
      publication cadence found in the papers research.

  - id: google-deepmind
    label: Google DeepMind
    method: rss
    index_url: https://deepmind.google/blog/rss.xml
    text_source: full_text
    date_from: feed
    notes: >
      Was `method: sitemap` on deepmind.google/sitemap.xml until D66, chosen
      "for parity with Anthropic's proven path". That sitemap does not
      enumerate the blog and the register was silently missing most of it.

      Measured 2026-09-05 over the 3-month window: the sitemap yielded 12
      articles, the RSS feed 30, and the sitemap's 12 are a strict subset of
      the RSS 30. The 18 it missed were not a random sample -- they were
      overwhelmingly the model launches, which is the highest-signal category
      this product has. Gemini 3.6 Flash, 3.7 Flash, 3.8 Flash and 3.8 Flash
      Cyber, Gemma 4 12B, DiffusionGemma, Nano Banana 2 Lite, Gemini Omni 1.1
      Flash, Gemini 3.5 Transcribe, computer use in Gemini 3.5 Flash, Gemini
      Robotics ER 2, WeatherNext 3 and Lyria 3.5 were all absent. What the
      sitemap did carry was the education, policy and programme posts. The
      register therefore read as though DeepMind shipped nothing but outreach
      for three months.

      The sitemap is not stale, it is not a blog index: 731 URLs total, of
      which 347 match /blog/, against a blog with far more history than that,
      and 267 of the 347 carry an identical 2026-07 <lastmod> from a bulk
      re-render. Its <lastmod> was already only trusted as a coarse
      prefilter, and that was the right call -- but a prefilter cannot
      recover a URL the document never listed.

      RSS carries a real pubDate per item, so `date_from: feed` replaces
      reading the date off the page. That also fixes a drift the page path
      had: it dated "Securing the future of AI agents" to 2026-06-18 against
      the feed's 06-16, and Gemini Robotics 2 to 07-30 against 07-28, because
      the first "Month D, YYYY" in the stripped text is not always the
      article's own.

      Feed depth is the one thing to watch. It holds 100 items reaching back
      to 2026-01, comfortably past a 3-month window, but it is a fixed-length
      feed rather than a paginated archive -- if `window_months` is ever
      raised much beyond 6, this stops being sufficient on its own.

      `from_rss` fetches each item's page for the real article text because
      `text_source: full_text` is set. Some article URLs 302-redirect
      off-domain to blog.google; urllib follows redirects by default, so this
      needs no fetch-layer code.

      Feed <link> values carry a trailing slash where the sitemap path
      stripped it, so every DeepMind URL changes form on this switch. URL is
      the unique key on `raw_articles`, so this needs a `bitcap-db rebuild`
      rather than an incremental load, or the 12 old rows persist alongside
      their 30 replacements.

  - id: mistral
    label: Mistral AI
    method: rss
    index_url: https://mistral.ai/news/rss
    text_source: full_text
    date_from: feed
    notes: >
      Not blocked. RSS discovery was chosen over the sitemap because the feed
      is already English-only (the sitemap enumerates /fr/news/ duplicates
      that would need filtering out) and gives a clean pubDate directly.
      `from_rss` now fetches each item's own page for the real article text
      when `text_source: full_text` is set (previously the RSS path only ever
      returned the feed's title+summary, silently mislabelled as whatever
      text_source the config claimed -- fixed alongside this entry) rather
      than adding a second, sitemap-based lab entry.

  - id: meta-ai
    label: Meta AI
    method: listing_pagination
    index_url: https://ai.meta.com/blog/
    page_param: page
    url_contains: /blog/
    text_source: full_text
    date_from: page
    user_agent: ""
    notes: >
      No RSS feed at any path tried. Sitemap is gated to named crawler UAs
      only -- robots.txt explicitly allows facebookexternalhit and
      meta-externalads, 403 for everyone else, confirmed live. Discovery
      instead paginates the plain blog listing (ai.meta.com/blog/?page=N).

      Confirmed live, and the opposite of every other lab here: a plain
      fetch with no custom User-Agent gets 200; any browser-style
      User-Agent gets 400. Hence the empty `user_agent` override, which
      `from_listing_pagination`/`fetch` read as "send no override, let
      urllib use its own non-browser-shaped default."

      No structured date metadata found on article pages (no OpenGraph
      tags, no JSON-LD) -- date is read from visible page text, same regex
      every page-sourced lab already uses.

      This channel is not broken and was checked rather than assumed (D66).
      Crawled to exhaustion on 2026-09-05: 231 unique articles reaching back
      to 2019, of which exactly 5 are inside a 3-month window, and the
      register holds all 5. ai.meta.com/blog is simply quiet -- its newest
      post was 40 days old on the day this was measured. Two things about it
      are worth knowing before trusting a future count. The listing is not
      reverse-chronological: page 1 carried March, April, June and July posts
      together, because five sticky "featured" items repeat on every page.
      And `from_listing_pagination` stops at the first page with no in-window
      article, which on a listing ordered like this could stop early -- it
      does not today only because the sticky block sits on page 1.
    also:
      - method: rss
        enabled: true
        index_url: https://about.fb.com/news/tag/ai/feed/
        feed_pages: 3
        feed_page_param: paged
        notes: >
          Second channel, because ai.meta.com/blog is not where Meta's
          investment-relevant AI news lands. Meta Newsroom's AI tag carried
          the BlackRock data-centre joint venture, the Reliance AI data centre
          in India, the Louisiana and Canada data-centre expansions and
          "Infrastructure Explained: Compute Power" -- none of which appear on
          the AI blog at all. For a fund whose exposure to Meta runs through
          capex into the compute and energy complex, that is the highest-value
          Meta signal there is, and the register had none of it.

          Measured 2026-09-05: 15 in-window items, against 5 from the blog.
          Two of the 15 restate blog posts (Muse Image, Muse Spark) at a
          different URL, which is what the dedupe gates exist for -- the exact
          pass will not catch them (different titles) but the cosine band
          will, and this is the same shape as the openai.com/community.openai
          pair already handled there.

          It is a corporate newsroom rather than a research blog, so it also
          carries programme and CSR posts ("Facebook Verified", "America's
          Workforce Academy"). Those are left to the signal filter rather than
          removed by a keyword rule here: a filter that silently drops a real
          launch is a worse failure than a low-scoring row, and this pipeline
          already has a scorer whose job is exactly that judgement.

          `feed_pages: 3` because the feed serves ten items per page and page
          1 reached only 2026-07-07 -- short of a 3-month window. Pages 1-2
          cover to 2026-04-28, and the third is margin against a slower month
          or a longer `window_months`. Confirmed live that `?paged=N` is
          honoured and that pages carry distinct items.

          Inherits `user_agent: ""` from the entry above. Confirmed live that
          both the feed and its article pages serve 200 to a blank agent.

  - id: xai
    label: xAI / SpaceXAI
    method: wayback_cdx
    index_url: https://x.ai/news
    url_contains: /news/
    text_source: full_text_archived
    date_from: page
    notes: >
      Live x.ai is fully Cloudflare-blocked on every path, including
      sitemap.xml itself, confirmed repeatedly across this project.
      Discovery goes through the Internet Archive's CDX API instead of a
      live fetch -- not just full-text recovery for an already-known URL
      the way backfill_openai.py uses it, but discovery itself.

      The originally planned method (fetch x.ai's own sitemap via its
      archived copy) does not work: confirmed live that
      x.ai/sitemap.xml has not been re-archived since February 2026, so
      its URL list would miss every article actually inside a 3-month
      window. Uses a direct CDX wildcard query on the article path instead
      (x.ai/news*), which finds real recent snapshots regardless of
      whether the sitemap itself was ever re-crawled.

      A snapshot's crawl date has no relationship to the article's publish
      date -- confirmed live, e.g. a 2024-dated funding-round page was
      recrawled in August 2026, completely ordinary archive behaviour.
      Every candidate is therefore dated from its own JSON-LD
      datePublished field, never from the CDX timestamp.

      Site brand is "SpaceXAI" as of the February 2026 SpaceX acquisition
      (D14), rendered even on old pages' titles since a page's <title> is
      generated at crawl time, not publish time -- both "SpaceXAI" and the
      earlier "xAI" suffix are stripped from titles regardless of an
      article's own age.
