# Person aliases for the contributor register.
#
# HUMAN-OWNED CONFIG. Never written by code. `research/papers/alias_candidates.py`
# proposes into config/aliases_proposed.yaml; merging a proposal into this file is
# a deliberate human act.
#
# This separation exists because the generator overwrote this file once and
# destroyed ten confirmed merges: after the aliases took effect the duplicate
# spellings no longer appear in the register, so regeneration correctly proposed
# nothing - and wrote that nothing over the config.
#
# Aliases apply at AGGREGATION time only. Per-article bylines keep exactly what
# each page published, so any merge is reversible by editing here.
#
# verdict is the evidence that supported the merge, recorded at confirmation time.

