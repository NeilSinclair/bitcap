# Repository ranking, and what the releases leg watches.
#
# THE RANKING IS STARS. There is no second sort key and no blended score.
#
# Commit volume was tried first and rejected on the data (docs/decisions.md).
# The failure is not marginal: xAI's three most newsworthy repositories are its
# three *least* committed, because they are code dumps -- published artifacts
# pushed by CI rather than developed in the open. `x-algorithm` (the For You
# feed algorithm, 32,559 stars) carries 19 commits, all from a CI account;
# `grok-prompts` (Grok's system prompts, 4,429 stars) carries 2. A commit
# ranking puts `xai-sdk-python` (562 stars) above both.
#
# Commits survive here only as displayed evidence -- is this repository alive
# or is it an archive -- and must never re-enter the sort. `tests/
# test_rank_repos.py::TestStarsAreTheOnlyRanking` pins that.
#
# The known weakness of a raw star ranking is that it is a hall of fame rather
# than a signal: 40% of the top 100 have no commit in the last 90 days, and the
# list would be identical next month. Two cuts address it, neither reintroducing
# commits:
#
#   1. `new_within_days` splits new from established using the repository's
#      real `created_at`, fetched from the API. For a repository created inside
#      the window every star was earned inside the window, so stars are a
#      velocity by construction. First-commit-in-window does NOT work as a
#      proxy -- `openai/whisper` (2022) reports a first commit of 2026-03-27
#      because it was dormant and got touched, and would read as new. It is
#      captured from the org listing on every run by
#      `adapters._listing_fields`, alongside the live star count.
#   2. Star delta. Not implemented: `raw_github_repos` keeps one payload per
#      repository, overwritten on each walk, so there is no star history to
#      difference. Recorded as the obvious next cut, not as something this
#      file configures.

version: 1


# A repository whose `created_at` falls inside this many days is cut as `new`.
# Matches the commit harvest window so the two views describe the same period.
new_within_days: 365

# Floor for entering the ranking at all. Zero keeps every repository visible in
# the full table; the shortlist cap is what bounds the LLM spend. Raising this
# would silently hide the long tail, so it is left off by default.
min_stars: 0

# --- Release watching -------------------------------------------------------
#
# A release note is a dated document with a title, a body and a permanent URL,
# which is the shape the announcements leg already consumes -- so releases are
# a source, not a new kind of thing. The star ranking is the gate: watching all
# 770 repositories would be absurd, watching the top few dozen is one cheap
# call each per run.
#
# Volume, not coverage, is the cost driver here. `openai/codex` cut 240
# releases in 90 days and `anthropics/claude-code` 75, so the unit has to be
# "releases since the last run" -- a fixed 90-day window would re-extract
# hundreds of documents on every run. `source_state.watermark["cursors"]`
# holds that mark, one entry per repository.

# How many repositories off the top of the star ranking are watched, **per
# org**. Sources are per org so they fail independently, which means each one
# ranks only its own repositories -- 8 orgs x this number, not this number in
# total.
#
# Per org rather than globally on purpose: a single global cut is dominated by
# OpenAI and Anthropic, and xAI (8 repositories in the window) and meta-llama
# (8) would never appear at all. Every lab getting its own top slice is what
# makes this a multi-lab tracker rather than a two-lab one.
#
# 10 x 8 orgs is ~80 repositories. The first firing at 40 ingested 380
# documents, which is roughly $10 to classify against a $3 per-run ceiling --
# the budget guard handles it correctly, spending $3 and reporting the rest as
# `skipped_for_budget`, but three nights of catching up is not what this leg is
# for.
releases_watch: 10

# First-run cap. A repository with no cursor has its whole history available
# and codex alone would contribute 300 documents, so only the most recent few
# are taken. Everything older is dropped and reported, never silently.
releases_backfill: 5

# Per-repository cap on a single run once a cursor exists. Guards against a
# burst -- or a long gap between runs -- flooding the extractor. A truncated
# repository is named in the run output.
releases_per_run: 20

# Pages of 100 to walk while looking for the cursor. Three covers codex's
# ~2.7 releases/day for a year of downtime; beyond that the cursor is treated
# as unreachable and the fetch reports truncation rather than pretending it
# caught up.
releases_max_pages: 3


# --- Relevance --------------------------------------------------------------
#
# The star ranking is a popularity order, not a topic filter, so it surfaces a
# lab's best work in every field: a physics simulator, a protein structure
# pipeline, a fusion solver, a weather model, vision libraries. Those are not
# mis-scored -- `alphafold3` averages 35.6 on the AI axis, third of all 87
# repositories watched -- which is precisely why no threshold on `score` or
# `ai_score` removes them. Relevance is a different axis and needs its own
# question, asked once per repository and cached in `raw_llm_responses`.
#
# The gate runs **inside** the ranking walk, not after the `releases_watch`
# slice. A rejected repository frees its slot to the next one down, so dropping
# a physics simulator promotes a real one rather than shrinking the list. That
# is worth having: xAI's `grok-prompts` (Grok's system prompts) and `grok-build`
# (its coding agent) both rank above watched repositories and neither is
# currently reached.
#
# **Vendor SDKs are kept deliberately.** A client-library bump is thin and
# frequent and looks exactly like the noise this filter exists to remove -- and
# it is also where a new model identifier first appears in public. The
# release-to-launch pairing added in D61 runs on those releases. Cleaning them
# up would read as an improvement and would delete the feature's best evidence.
relevance:
  # Kill switch. Off restores the previous behaviour exactly -- the top
  # `releases_watch` of the ranking, ungated. It exists because the first firing
  # after this lands backfills every newly promoted repository at
  # `releases_backfill` apiece, and an operator needs to be able to stop that
  # without a deploy.
  enabled: true

  # Chosen by measurement, not by price -- see D65. Both candidates were run
  # over all 183 labelled repositories:
  #
  #                      recall(relevant)   precision   watched   $      median
  #   claude-haiku-4-5        0.692           0.988      0.750   $0.208   2.0s
  #   gpt-5-mini              0.875           0.981      0.942   $0.120   3.4s
  #
  # Recall is the deciding metric because the two errors are not symmetric: a
  # wrongly excluded repository stops producing articles and nothing downstream
  # can tell that apart from a repository that shipped nothing, while a wrongly
  # kept one costs one classification and is visible in the feed.
  #
  # The concrete version of that gap: Haiku drops `openai/codex` -- the
  # repository D61's release-to-launch pairing actually runs on -- along with
  # `openai/harmony`, `openai/skills` and `deepseek-ai/deepseek-harness`. It is
  # not a marginal difference in a summary statistic.
  #
  # It being cheaper too is a coincidence, not the reason. Measured medians per
  # call over the 183: Haiku 882 in / 48 out, gpt-5-mini 705 in / 193 out.
  # gpt-5-mini is cheaper *despite* emitting four times the output, because it
  # prices input at a quarter of Haiku's and this prompt is input-heavy. Sizing
  # a change to r1.md against "~40 out" would under-budget it by about five
  # times, on the side priced at 8x its input.
  #
  # The model string is the exact key in `providers.PRICES`. An unpriced name
  # works through the whole API call and then raises KeyError while building the
  # cost record -- after the provider has billed it. `config/validate.py` checks
  # membership so that fails at validation rather than at 03:00 with money spent.
  provider: openai
  model: gpt-5-mini

  # Reads prompts/repo_relevance/<version>.md. Verdicts are cached under
  # "<version>:<model>", so editing the prompt *or* changing the model
  # invalidates them rather than silently serving answers from the other one.
  prompt_version: r1

  # Ceiling on **paid** judgements per org per firing. Laziness bounds the
  # typical case -- the walk stops as soon as `releases_watch` repositories pass
  # -- but an org whose ranking is mostly off-topic has no natural stopping
  # point, and facebookresearch lists 395 repositories in the window. The money
  # is small; 395 sequential calls bolted onto a firing already running 9-30
  # minutes is not.
  #
  # Cache hits do not count, and that is deliberate. This ceiling exists to
  # bound spend and wall-clock, and a cached verdict costs neither -- counting
  # them froze the walk at a fixed depth for ever, which left facebookresearch
  # watching three repositories instead of ten with no way to recover. So on a
  # cold walk this is the ceiling and the list may come up short; once the
  # verdicts are bought the walk runs as deep as it needs to, for free.
  #
  # Keep it >= releases_watch: below that, a cold walk can never fill the list.
  max_judged: 30
