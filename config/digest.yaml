# The periodic digest. Config, not code.
#
# WHAT A DIGEST IS, AND WHY IT IS PERSISTED RATHER THAN COMPUTED ON READ.
#
# Every other clean table in this schema is a pure function of committed files,
# so `rebuild` may drop it. A digest is not: it is a record of what the product
# *said* at a point in time. Recomputing one later against a re-scored corpus
# would silently rewrite history -- a reader opening last week's digest would
# see today's opinions under last week's date. So `digests` is an ops table
# (app/models.py OPS_TABLES) and survives a rebuild, on the same reasoning as
# pipeline_runs and alerts.
#
# THE CUT IS THE PRODUCT. The dashboard shows every classified article; the
# digest is the claim that a handful of them are worth a reader's attention and
# the rest are not. Every threshold below is that claim in a number, and every
# digest records how many items it suppressed so the claim is auditable rather
# than asserted.

version: 1

# TWO WINDOWS, AND THEY ARE DELIBERATELY DIFFERENT NUMBERS.
#
# The digest page has two surfaces and they answer different questions, so they
# get different widths. Until D79 they shared one value and were the same width
# by accident -- which meant the archive of 48-hour editions a reader could
# still browse was a FOSSIL, published back when the single value read 48, and
# every future edition would have been 7 days wide until the distinction
# disappeared entirely.
#
#   window_hours          the PUBLISHED editions. Quantised to a fixed grid, one
#                         edition per period, persisted for ever. The archive.
#
#   preview_window_hours  the CURRENT unpublished view. Rolling, ends now, never
#                         stored, rebuilt on every page load. What a reader sees
#                         when they open the page, because `editionId` starts on
#                         "current" (frontend/app/digest/page.js).
#
# ---------------------------------------------------------------------------
# window_hours: 24 -- one published edition a day, covering that day.
#
# The measurement this rests on -- AND ITS PROVENANCE, WHICH MATTERS. These rows
# were replayed for D51, over the announcements corpus alone, under
# `ai.min_band: medium` and `max_items: 8`. Three things have changed since:
# papers, releases and posts joined the digest (D57, D69, D76), the AI cut moved
# to `high` (D78) and the caps to 16 (D77). More corpora push the empty
# percentages DOWN; a stricter AI band pushes them UP. They have NOT been
# re-derived -- a full replay is ~180 whole-corpus builds and was abandoned as
# too slow to be worth blocking this change on.
#
# So read the table as the shape of the trade, not as today's numbers:
#
#   window   audience      editions   empty   median items
#     24h    investment          90     48%              1
#     24h    ai                  90     33%              1
#     48h    investment          45     31%              1
#     48h    ai                  45     13%              1
#     72h    investment          30     23%              2
#     72h    ai                  30      3%              2
#    168h    investment          12      0%              3
#    168h    ai                  12      0%              6
#
# READ THE 24h ROW BEFORE CHANGING ANYTHING. On the corpus it was measured
# against, nearly half of all investment editions were EMPTY at this width and a
# third of AI ones. Today's figures will differ -- see the provenance note above
# -- but not in a way that changes the decision: narrowing a window monotonically
# increases how often it catches nothing, and 24h is the narrowest this product
# publishes. That is the cost of a daily archive and it is being paid
# deliberately.
#
# It was the wrong trade when this value also drove the page a reader lands on
# -- an empty page on half of all days trains someone to stop opening it, which
# is why D51 chose 48h and D73 later widened to 168h. It is the right trade now
# that it does not: the landing view is `preview_window_hours` below and is
# never empty. What `window_hours` produces is an ARCHIVE, and an archive
# faithfully recording that the labs published nothing on the 14th is doing its
# job. The digest page says so in words rather than rendering a blank list.
#
# A multiple of 24, necessarily. `_in_window` compares at date resolution, so a
# grid that does not land on day boundaries disagrees with its own selection.
#
# This value does not have to DIVIDE the cron schedule in render.yaml.
# `window_for` snaps to a fixed grid of periods, so the daily 03:00 firing
# publishes each period once and re-publishes it harmlessly on any later firing
# inside it. Before that quantisation existed the two settings silently
# disagreed: a daily cron over a 48-hour lookback put every article in two
# consecutive editions (docs/decisions.md D51).
#
# BUT THE RELATIONSHIP MATTERS MORE AT 24h THAN IT DID AT 48h, and an earlier
# draft of this comment wrongly called the match "convenient and NOT a thing
# anything depends on". At 48h the daily cron fired TWICE inside every period,
# so a missed night was covered by the next firing. At 24h the grid and the cron
# coincide -- one period, one firing that closes it -- and a missed 03:00 run
# leaves that day with no edition at all, permanently, because the next firing
# has moved on to the next period.
#
# Measured: seven daily firings with one skipped publishes 7 of 8 periods at
# 24h and 5 of 5 at 48h. `digest.publish` therefore backfills complete periods
# that have no edition, bounded by `MAX_BACKFILL_PERIODS` (7), and never
# rebuilds a period that already has one. Narrowing this value further -- say to
# 12h -- would put two periods inside one firing and needs that cap revisited.
window_hours: 24

# ---------------------------------------------------------------------------
# preview_window_hours: 168 -- the last 7 days, ending now.
#
# Rolling, not quantised. A published edition must snap to a grid so that re-runs
# update one edition rather than issuing several; the preview writes nothing, so
# it has no such constraint, and the grid cost it real freshness -- the newest day
# in a quantised preview is always the last one that CLOSED, so on the 5th the
# live view claimed "the 48 hours to the 3rd" (D73).
#
# 168 IS NOT A MEASURED OPTIMUM, and the row above showing 0% empty editions at
# 168h is not the argument for it -- that row counts fixed weekly PERIODS, and
# this window is not one. What it is justified by:
#
#   * It is never empty in practice, which matters here and only here: this is
#     the view a reader lands on.
#   * A week is the widest span still describable as "recent". Ten days is a
#     monthly report with extra steps.
#   * It is wide enough that every corpus appears. At 48h the live view showed
#     ONE item and neither papers, releases nor posts were visible in it at all.
#
# Re-derive it if ingestion resumes; the corpus it was chosen against ends
# 05 Sep. `/api/digests/preview?hours=N` overrides it per request without
# changing anything published, which is the cheap way to test another width.
preview_window_hours: 168

investment:
  # A connection at or above this strength is worth a PM's attention. Matches
  # `alerts.content_min_strength` deliberately: an item that alerted in real
  # time and an item that reaches the digest should be the same class of thing,
  # or the two surfaces disagree about what matters.
  min_strength: 0.5

  # A high-band article with NO holding connection still surfaces. A lab-level
  # strategic shift that does not yet touch a name in the book is exactly the
  # early signal this system exists to catch -- requiring a connection would
  # filter out the most valuable case, which is the one that arrives before the
  # market has priced it.
  always_band: high

  # Hard cap on rows. A digest nobody finishes reading has suppressed nothing.
  #
  # RAISED 8 -> 16 (2026-09-06), and on this audience it is a no-op TODAY. The
  # investment rule (`min_strength` + `always_band`) admits 2 items of the 58
  # considered, so the cap has never been what bounds this digest -- measured,
  # 8 and 1000 produce the identical edition. Raised anyway so the two audiences
  # do not silently differ; the number that governs this one is the rule above.
  max_items: 16

ai:
  # An item reaches the AI team only if it carries a practice tagged `adopt` or
  # `investigate`. `monitor` is the null action and is not a recommendation;
  # surfacing it would pad the digest with items whose own classification says
  # to do nothing.
  actions: [adopt, investigate]

  # RAISED medium -> high (2026-09-06). `high` is ai_score >= 60
  # (config/scoring.yaml `bands`), and this is the merit cut D77 named as the
  # right lever when an edition reads as too long.
  #
  # Asked for as "scores above 0.5". There is no 0-1 score on this axis --
  # `ai_score` is 0-100, and the 0.5 in the investment block above is a
  # *connection strength*, which the AI rule does not use at all. Read as half
  # of the scale, and on the deployed corpus the two readings are the same
  # edition: the scores are quantised and nothing sits between 44.4 and 66.7,
  # so `>= 50` and `>= 60` both admit exactly these 8 items.
  #
  #   100.0  high    doc   GPT-6 Astra: A new generation of intelligence
  #   100.0  high    doc   Improving our alignment and security practices
  #    66.7  high    doc   anthropics/claude-code v2.1.260
  #    66.7  high    doc   deepseek-ai/deepseek-harness dsh-v0.1.2-rc.1
  #    66.7  high    doc   Introducing agentic video understanding with Gemini
  #    66.7  high    doc   Developing Enterprise Frontier Safeguards
  #    66.7  high    doc   Our decision on Cursor following its acquisition
  #    66.7  high    POST  1/ muse image is live on the meta model api
  #   -- cut here --
  #    44.4  medium  x4    (2 posts, 2 documents)
  #    33.3  medium  x3    (3 posts)
  #
  # THEY ARE NOT THE SAME RULE, and only the corpus makes them agree today. An
  # item scoring 55 exists in principle and would pass `>= 50` and fail this.
  # `min_band` is used rather than a new `min_score` key deliberately: two
  # numeric levers for one cut is the two-places-that-must-agree shape this
  # codebase keeps getting caught by, and `alerts.content_band` already
  # expresses the same threshold the same way.
  #
  # WHAT IT COSTS. 6 X posts become 1. That is the point -- but it also means
  # the AI digest is again almost entirely documents, and the posts leg going
  # nightly (D76) buys this audience one row. The 7 items cut are real
  # `investigate` recommendations, not noise; they are cut for ranking below a
  # line, and `suppressed` in the edition's stats records that they were.
  min_band: high

  # RAISED 8 -> 16 (2026-09-06). The cap WAS binding at the time: 15 items
  # passed the rule and 8 were shown, so 7 were dropped by the cap rather than
  # on merit.
  #
  # It no longer binds. `min_band: high` above now cuts on merit and admits 8,
  # so this is back to being what it should always have been -- a length limit
  # for a reader, not a filter. Left at 16 deliberately: lowering it to 8 would
  # make the two cuts agree by coincidence and hide which one is doing the work
  # the next time the corpus moves.
  #
  # What the cut was actually doing, measured on the deployed corpus before the
  # change -- and it is not what it looks like from the outside:
  #
  #   dropped by the cap:  7, EVERY ONE of them `medium` band
  #   of those 7:          5 are X posts, 2 are documents
  #   high-band items:     0 dropped -- the ranking already had all of them
  #                        inside the top 8
  #
  # So posts were not crowding out announcements. They rank below them, which
  # is the ranking working. The cap was cutting the medium tail, and the medium
  # tail is mostly posts.
  #
  # THE COST, STATED. At 16 this audience's edition goes from 8 rows to 15, and
  # 6 of those 15 are X posts -- from one in eight to roughly two in five. That
  # is a bigger change to what the AI digest FEELS like than the number
  # suggests, and it is the direct consequence of the posts leg going nightly
  # (D76): posts now reliably reach the window they belong to. If an edition
  # reads as noisy, `min_band: medium` is the honest lever, not this one --
  # raising it to `high` cuts on merit where this cuts on position.
  max_items: 16

# Per event, how many affected holdings to name before collapsing to a count.
#
# This is the D-digest fan-out control. One xAI sentence -- "trained across tens
# of thousands of NVIDIA GB300 GPUs" -- fires against seven holdings at once
# (docs/insights.md). As seven connection rows that is the noise the brief asks
# us to keep out; as one event naming its top holdings and counting the rest it
# is a single, true line. The digest groups by event for this reason.
max_holdings_shown: 4
