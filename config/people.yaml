# Senior people at each frontier lab, and the channels they publish on.
#
# The register tracks labs. Labs do not post -- people do. This file is the
# people leg: for each lab in sources.yaml, the senior figures whose personal
# channels are worth watching alongside the lab's own announcement feed.
#
# Adding a person is a config change, not a code change.
#
# SOURCING RULE, same as research/labs/frontier_labs.md: no field here comes
# from model knowledge. Every role and every channel was fetched on the date
# recorded below, and the fetch is cited at the person who states it. Where
# nothing could be sourced the field is `null` with a `notes` line saying so --
# it is never filled from memory. This matters more than usual for people data:
# the seven labs have churned hard through 2025-2026, and a name remembered in
# the right seat is the single easiest way to publish a wrong attribution.
#
# X HANDLES: MOSTLY NOT FETCH-VERIFIED. x.com returns HTTP 402 to the plain
# fetcher, so no profile page was read from the web. Six were read through the
# X API on 2026-09-05 once the posts leg had a credential (D64) and carry
# `api_profile`; the rest are still indirect. Each handle carries `x_evidence`
# recording how it was established, strongest first:
#
#   own_site      the person's own website or newsletter links the handle
#   self_post     a post from the handle itself, quoted with its status URL,
#                 in which the person states their own role
#   api_profile   the account was read directly through the X API and its own
#                 profile asserts the affiliation. Added 2026-09-05 (D64), when
#                 the posts leg made a direct read possible for the first time.
#                 `supports:` on its source says how far it reaches: a bio
#                 reading "President & Co-Founder @OpenAI" carries the role, one
#                 reading "OpenAI" carries only the handle.
#   lab_post      the lab's official account names the person and the handle
#   search_index  the profile URL appears in search results and nowhere better
#
# `search_index` is the weak tier. Treat it as a lead, not a fact, and do not
# ship an insight that depends on one without promoting it first.
#
# `departed` is not trivia. It is the guard against the most likely error this
# file can cause: attributing to a lab someone who left it. Four of the seven
# labs lost a named research leader in the last twelve months, and in xAI's
# case the entire founding bench. A person listed under `departed` must never
# be rendered as a voice of that lab.

version: 1
researched: 2026-09-03
# The date this file was last ADDED TO, as distinct from the bulk research pass
# above. 2026-09-05 is the D64 pass that read six profiles through the X API.
# Kept separate because bumping `researched` would claim the whole register was
# re-checked that day, which it was not.
revised: 2026-09-05
fetcher_notes: >
  Unreachable to this fetcher on the research date: x.com (402), cnbc.com (403),
  axios.com (403), bloomberg.com and reuters.com. Where a story was only
  available from one of those, an equivalent dated report was used instead and
  is the URL cited.

