# The suite only ran when someone remembered to run it. 1225 tests, ~25s, and
# nothing in the repo enforced them before this.
#
# No services and no secrets, and that is a property of the suite rather than an
# omission: `app/db.py` falls back to a local sqlite file when DATABASE_URL is
# unset, and every test that needs an LLM stubs it. Measured before writing this
# — the suite passes with `.env` absent. A workflow that needed a Postgres
# container and an API key would be one more thing to keep working.
#
# Deliberately no linting. Of ruff's 208 findings on this tree ~7 were real
# (dead imports) and the rest were style; the 40 naive-datetime flags are the
# only ones with real value and none are auto-fixable. That call is recorded in
# docs/decisions.md — do not add ruff here without revisiting it.
name: tests

on:
  push:
  pull_request:

# A second push to the same branch makes the first run irrelevant; cancel it
# rather than queueing behind it.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Matches `requires-python = ">=3.12"` in pyproject.toml.
      - name: Set up Python
        run: uv python install 3.12

      # `--frozen` fails if uv.lock disagrees with pyproject.toml, so a
      # dependency added without relocking is caught here rather than by the
      # next person whose environment silently resolves differently.
      - name: Install
        run: uv sync --frozen

      - name: pytest
        run: uv run pytest -q

      # Runs under plain node, outside pytest: the report is a single
      # self-contained HTML file with no build step, so a runtime error in its
      # inlined script is invisible until someone opens it. It has already
      # caught a temporal-dead-zone crash and a parseFloat that turned
      # "1,406.8 M EUR" into 1.
      - name: Smoke-test the built report
        run: node tests/smoke_report.js
