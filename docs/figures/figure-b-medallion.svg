<svg xmlns='http://www.w3.org/2000/svg' style='color:#141817' viewBox="0 0 1220 830" role="img" aria-label="The medallion architecture: a reference layer defined by config YAML supplies the tag vocabulary and the holdings map; bronze holds documents exactly as fetched, silver holds them typed and validated, gold holds what the reader receives — connections, digests, alerts and gold snapshots. An ops layer sits outside the flow and records it."><style>
  :root{--surface:#FFFFFF;--surface-2:#E9EDEA;--ink:#141817;--muted:#5B6663;--rule:#D2D8D4;
        --accent:#0F6E5C;--accent-tint:#E2F0EB;--warn:#9C5316;--warn-tint:#F6EADD;
        --sans:'Helvetica Neue',Arial,sans-serif;--mono:Menlo,'SF Mono',monospace;}
  html,body{margin:0;padding:0;background:#fff}
  .pad{padding:28px;background:#fff}
  svg{display:block;width:100%;height:auto;color:var(--ink)}
  .d-box{fill:var(--surface);stroke:currentColor;stroke-width:1.1}
  .d-fill{fill:var(--surface-2);stroke:currentColor;stroke-width:1.1}
  .d-acc{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.3}
  .d-warn{fill:var(--warn-tint);stroke:var(--warn);stroke-width:1.3}
  .d-ghost{fill:none;stroke:var(--rule);stroke-width:1.1;stroke-dasharray:3 4}
  .d-lab{font-family:var(--sans);font-size:13.5px;font-weight:600;fill:var(--ink)}
  .d-sub{font-family:var(--sans);font-size:11px;fill:var(--muted)}
  .d-mono{font-family:var(--mono);font-size:11px;fill:var(--ink)}
  .d-note{font-family:var(--sans);font-size:11.5px;fill:var(--muted)}
  .d-eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:0.1em;fill:var(--muted)}
  .d-accent-text{fill:var(--accent)}
  .d-line{stroke:currentColor;stroke-width:1.2;fill:none}
  .d-dash{stroke:var(--muted);stroke-width:1.1;fill:none;stroke-dasharray:4 3}
  .d-rule{stroke:var(--accent);stroke-width:2}
  .d-layer{font-family:var(--sans);font-size:25px;font-weight:700;letter-spacing:-0.02em;fill:var(--ink)}
  .d-layer-s{font-family:var(--sans);font-size:19px;font-weight:700;letter-spacing:-0.01em;fill:var(--ink)}
  .d-step{font-family:var(--mono);font-size:12px;letter-spacing:0.1em;fill:var(--muted)}
  .d-num{font-family:var(--mono);font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
  .d-hair{stroke:var(--rule);stroke-width:1}
  .d-hair-acc{stroke:var(--accent);stroke-width:1}
  .d-bronze{fill:var(--warn-tint);stroke:var(--warn);stroke-width:1.3}
  .d-silver{fill:var(--surface);stroke:currentColor;stroke-width:1.3}
  .d-gold{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.6}
</style>
          <defs>
            <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
              <polygon points="0,1 10,5 0,9" fill="currentColor"></polygon>
            </marker>
          </defs>

          <rect class="d-fill" x="40" y="40" width="1140" height="188" rx="6"></rect>
          <text class="d-layer" x="64" y="82">Reference</text>
          <text class="d-sub" x="64" y="102">config/*.yaml is the source of truth — edit the file, the layer follows on the next run</text>
          <line class="d-hair" x1="64" y1="118" x2="1156" y2="118"></line>
          <text class="d-mono" x="64" y="146">ref_labs</text>
          <text class="d-num" x="264" y="146" text-anchor="end">7</text>
          <text class="d-mono" x="64" y="164">ref_mechanisms</text>
          <text class="d-num" x="264" y="164" text-anchor="end">13</text>
          <text class="d-mono" x="64" y="182">ref_categories</text>
          <text class="d-num" x="264" y="182" text-anchor="end">13</text>
          <text class="d-mono" x="64" y="200">ref_practices</text>
          <text class="d-num" x="264" y="200" text-anchor="end">5</text>
          <text class="d-mono" x="380" y="146">holdings</text>
          <text class="d-num" x="580" y="146" text-anchor="end">26</text>
          <text class="d-mono" x="380" y="164">holding_mechanisms</text>
          <text class="d-mono" x="380" y="182">holding_categories</text>
          <text class="d-mono" x="380" y="200">holding_lab_exposure</text>
          <text class="d-note" x="700" y="146">The vocabulary every tag must come from,</text>
          <text class="d-note" x="700" y="164">and the map from a tag to a position.</text>
          <text class="d-note" x="700" y="188">Adding a lab, a mechanism or a holding</text>
          <text class="d-note" x="700" y="206">is a change to a file, not to code.</text>

          <line class="d-dash" x1="610" y1="240" x2="610" y2="282" marker-end="url(#arb)"></line>
          <text class="d-note" x="622" y="266">tag vocabulary</text>
          <line class="d-dash" x1="1020" y1="240" x2="1020" y2="282" marker-end="url(#arb)"></line>
          <text class="d-note" x="1032" y="266">holdings map</text>

          <rect class="d-bronze" x="40" y="286" width="320" height="382" rx="6"></rect>
          <text class="d-step" x="64" y="318">01</text>
          <text class="d-layer" x="64" y="350">Bronze</text>
          <text class="d-sub" x="64" y="370">exactly as fetched, never edited</text>
          <line class="d-hair" x1="64" y1="386" x2="336" y2="386"></line>
          <text class="d-mono" x="64" y="412">raw_articles</text>
          <text class="d-num" x="336" y="412" text-anchor="end">746</text>
          <text class="d-mono" x="64" y="430">raw_llm_responses</text>
          <text class="d-num" x="336" y="430" text-anchor="end">1,238</text>
          <text class="d-mono" x="64" y="448">raw_github_people</text>
          <text class="d-num" x="336" y="448" text-anchor="end">3,256</text>
          <text class="d-mono" x="64" y="466">raw_github_repos</text>
          <text class="d-num" x="336" y="466" text-anchor="end">773</text>
          <text class="d-mono" x="64" y="484">raw_article_embeddings</text>
          <text class="d-num" x="336" y="484" text-anchor="end">710</text>
          <text class="d-mono" x="64" y="502">raw_costs</text>
          <text class="d-num" x="336" y="502" text-anchor="end">2,827</text>
          <text class="d-mono" x="64" y="520">raw_papers</text>
          <text class="d-num" x="336" y="520" text-anchor="end">25</text>
          <text class="d-mono" x="64" y="538">fetch_cache</text>
          <text class="d-num" x="336" y="538" text-anchor="end">142</text>
          <text class="d-note" x="64" y="616">Any claim can be checked against this.</text>

          <line class="d-line" x1="364" y1="474" x2="446" y2="474" marker-end="url(#arb)"></line>
          <text class="d-note" x="405" y="462" text-anchor="middle">classify</text>
          <text class="d-note" x="405" y="496" text-anchor="middle">+ transform</text>

          <rect class="d-silver" x="450" y="286" width="320" height="382" rx="6"></rect>
          <text class="d-step" x="474" y="318">02</text>
          <text class="d-layer" x="474" y="350">Silver</text>
          <text class="d-sub" x="474" y="370">typed, validated, deduplicated</text>
          <line class="d-hair" x1="474" y1="386" x2="746" y2="386"></line>
          <text class="d-mono" x="474" y="412">articles</text>
          <text class="d-num" x="746" y="412" text-anchor="end">746</text>
          <text class="d-mono" x="474" y="430">classifications</text>
          <text class="d-num" x="746" y="430" text-anchor="end">746</text>
          <text class="d-mono" x="474" y="448">article_mechanisms</text>
          <text class="d-num" x="746" y="448" text-anchor="end">294</text>
          <text class="d-mono" x="474" y="466">article_categories</text>
          <text class="d-num" x="746" y="466" text-anchor="end">48</text>
          <text class="d-mono" x="474" y="484">article_practices</text>
          <text class="d-num" x="746" y="484" text-anchor="end">700</text>
          <text class="d-mono" x="474" y="502">article_groups</text>
          <text class="d-num" x="746" y="502" text-anchor="end">459</text>
          <text class="d-mono" x="474" y="520">article_links</text>
          <text class="d-num" x="746" y="520" text-anchor="end">12</text>
          <text class="d-mono" x="474" y="538">people</text>
          <text class="d-num" x="746" y="538" text-anchor="end">4,806</text>
          <text class="d-mono" x="474" y="556">person_identity</text>
          <text class="d-num" x="746" y="556" text-anchor="end">4,812</text>
          <text class="d-mono" x="474" y="574">person_evidence</text>
          <text class="d-num" x="746" y="574" text-anchor="end">6,280</text>
          <text class="d-mono" x="474" y="592">unresolved_items</text>
          <text class="d-num" x="746" y="592" text-anchor="end">3</text>
          <text class="d-note" x="474" y="646">Unknown tags dropped, every quote verified.</text>

          <line class="d-line" x1="774" y1="474" x2="856" y2="474" marker-end="url(#arb)"></line>
          <text class="d-note" x="815" y="462" text-anchor="middle">connect</text>
          <text class="d-note" x="815" y="496" text-anchor="middle">+ publish</text>

          <rect class="d-gold" x="860" y="286" width="320" height="382" rx="6"></rect>
          <text class="d-step d-accent-text" x="884" y="318">03</text>
          <text class="d-layer d-accent-text" x="884" y="350">Gold</text>
          <text class="d-sub" x="884" y="370">what the reader actually receives</text>
          <line class="d-hair-acc" x1="884" y1="386" x2="1156" y2="386"></line>
          <text class="d-mono" x="884" y="412">connections</text>
          <text class="d-num" x="1156" y="412" text-anchor="end">1,518</text>
          <text class="d-mono" x="884" y="430">digests</text>
          <text class="d-num" x="1156" y="430" text-anchor="end">40</text>
          <text class="d-mono" x="884" y="448">alerts</text>
          <text class="d-num" x="1156" y="448" text-anchor="end">297</text>
          <text class="d-mono" x="884" y="466">gold_snapshots</text>
          <text class="d-num" x="1156" y="466" text-anchor="end">10</text>
          <text class="d-note" x="884" y="516">connections — an article joined to a</text>
          <text class="d-note" x="884" y="534">holding, carrying the route that fired</text>
          <text class="d-note" x="884" y="552">and both sides’ verbatim evidence.</text>
          <text class="d-note" x="884" y="590">digests, alerts and gold_snapshots are</text>
          <text class="d-note" x="884" y="608">dated — each records what went out on</text>
          <text class="d-note" x="884" y="626">one day, so none can be recomputed.</text>

          <rect class="d-ghost" x="40" y="700" width="1140" height="106" rx="6"></rect>
          <text class="d-layer-s" x="64" y="736">Ops</text>
          <text class="d-sub" x="64" y="756">outside the flow, and the record of it</text>
          <text class="d-mono" x="380" y="736">pipeline_runs</text>
          <text class="d-num" x="570" y="736" text-anchor="end">45</text>
          <text class="d-mono" x="380" y="754">run_sources</text>
          <text class="d-num" x="570" y="754" text-anchor="end">208</text>
          <text class="d-mono" x="380" y="772">source_state</text>
          <text class="d-num" x="570" y="772" text-anchor="end">30</text>
          <text class="d-note" x="700" y="736">Every firing, every source it tried, and every failure.</text>
          <text class="d-note" x="700" y="754">What the /ops tab reads, and what alerting fires from.</text>
        </svg>