[project]
name = "bitcap"
version = "0.1.0"
description = "Frontier Lab Intelligence — ingestion, extraction, scoring, and the lab-to-holding join."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.2",
    "openai>=3.7",
    "pyyaml>=6.0",
    "pypdf>=5.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
bitcap-db = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
