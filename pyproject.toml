[project]
name = "bitcap"
version = "0.1.0"
description = "Frontier Lab Intelligence — ingestion, extraction, scoring, and the lab-to-holding join."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.2",
    "openai>=3.7",
    "pyyaml>=6.0",
    "pypdf>=5.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]
# api/ is a separate serving layer, not part of the bitcap-db pipeline; a
# plain `pip install bitcap` for the CLI should not have to pull in a web
# server and its transitive stack.
api = ["fastapi>=0.115", "uvicorn>=0.32"]

[tool.uv]
default-groups = ["dev", "api"]

[project.scripts]
bitcap-db = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "api"]
# app/ reads these at runtime (config is the source of truth for the refs;
# research/docs holds the committed artifacts the loaders read), so an
# installed wheel without them would import fine and then fail on first use.
force-include = { "config" = "config", "research/docs" = "research/docs" }

[tool.pytest.ini_options]
testpaths = ["tests"]
