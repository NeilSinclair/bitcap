# Render blueprint: the API and the dashboard, both on free instances.
#
# The database is not here: Render's free Postgres expires after 30 days, so it
# is hosted elsewhere and reaches the API as a plain DATABASE_URL secret. The
# scheduled firing is not here either: it is a GitHub Actions workflow
# (.github/workflows/pipeline.yml), because a Render cron job is a paid service
# (docs/decisions.md D83).
#
# Secrets are `sync: false`: Render prompts for them once and never stores them
# here.

services:
  - type: web
    name: bitcap-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    plan: free
    # /api/ping, not /api/health: the probe runs for as long as the service is
    # up, and one that queries the database never lets a scale-to-zero Postgres
    # suspend. Point the uptime monitor that keeps this instance awake at the
    # same path.
    healthCheckPath: /api/ping
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      # The operator account, which only guards starting a run. Generate the
      # hash and the secret with `uv run python -m api.auth` and paste them into
      # the Render dashboard -- never into this file, which is committed.
      - key: AUTH_EMAIL
        sync: false
      - key: AUTH_PASSWORD_HASH
        sync: false
      - key: AUTH_SECRET
        sync: false
      # Only for the run button. The API starts a firing in a background
      # thread, and a free instance can be restarted or slept under it; a run
      # cut short that way is reaped as `failed` after two hours
      # (app/runs.py). The weekly firing does not depend on any of these.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: X_BEARER_TOKEN
        sync: false

  # The dashboard. A static site, not a Node service: both routes are client
  # components that fetch the API in the browser, so `next build` with
  # output: "export" produces a folder of files with no server to keep warm.
  #
  # NEXT_PUBLIC_API_URL is inlined into the bundle at build time, so changing
  # it requires a rebuild, not a restart. Render triggers one on the change.
  - type: web
    name: bitcap-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
